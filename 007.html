<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>007 特務對決</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1a1a2e; /* 特務暗色風格 */
            color: #e0e0e0;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
        }

        /* 受傷時的全螢幕紅光閃爍 */
        #red-flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 80px rgba(255, 0, 0, 0);
            pointer-events: none; z-index: 9999; transition: box-shadow 0.1s;
        }
        #red-flash-overlay.flash { box-shadow: inset 0 0 120px rgba(255, 0, 0, 0.8); }

        .btn-home {
            position: fixed; top: 15px; left: 15px; z-index: 99999;
            box-sizing: border-box; height: 36px; padding: 0 14px;
            font-family: system-ui, -apple-system, sans-serif; font-size: 14px;
            font-weight: 600; color: #333333; background-color: #ffffff;
            border: 1px solid #d1d5db; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
        }

        /* 靜音按鈕 */
        .btn-mute {
            position: fixed; top: 15px; right: 15px; z-index: 99999;
            box-sizing: border-box; width: 36px; height: 36px;
            font-size: 18px; color: #333; background-color: #fff;
            border: 1px solid #d1d5db; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
        }

        #game-wrap {
            background: #16213e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 2px solid #0f3460;
            position: relative;
        }

        /* 畫面震動特效 */
        .shake-active { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        h2 { margin: 0 0 8px 0; color: #e94560; font-size: 22px; letter-spacing: 2px; }
        .subtitle { font-size: 12px; color: #a9a9a9; margin-bottom: 20px; }

        /* 戰鬥舞台區 */
        .battle-stage {
            display: flex; flex-direction: column; gap: 20px;
            background: #0f3460; padding: 20px; border-radius: 12px;
            margin-bottom: 20px; position: relative;
        }

        /* 語音氣泡 (對手挑釁) */
        .speech-bubble {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            background: #fff; color: #333; padding: 6px 10px; border-radius: 8px;
            font-size: 12px; font-weight: bold; opacity: 0; transition: opacity 0.2s, transform 0.2s;
            white-space: nowrap; pointer-events: none; z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            border-width: 5px 5px 0; border-style: solid; border-color: #fff transparent transparent transparent;
        }
        .speech-bubble.show { opacity: 1; transform: translateX(-50%) translateY(-5px); }

        /* 探員卡片 */
        .agent-card {
            display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;
        }
        .agent-name { font-size: 14px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 6px;}
        .bullet-belt-container {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .bullet-label { font-size: 10px; color: #8899aa; font-weight: bold; }
        .bullet-belt {
            display: flex; gap: 6px; height: 24px; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.3); padding: 4px 12px; border-radius: 20px; min-width: 70px;
        }
        .bullet-icon { font-size: 16px; transition: 0.2s; }
        .bullet-icon.loaded { color: #f39c12; text-shadow: 0 0 5px rgba(243, 156, 18, 0.8); }
        .bullet-icon.empty { opacity: 0.2; filter: grayscale(100%); }

        /* 動作揭曉區 (中央) */
        .action-reveal {
            height: 65px; display: flex; justify-content: space-between; align-items: center;
            font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.2);
            border-radius: 8px; padding: 0 20px; position: relative; overflow: hidden;
        }
        .action-icon {
            opacity: 0; transform: scale(0.5); transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .action-icon.show { opacity: 1; transform: scale(1); }
        
        /* 防禦成功時的護盾發光特效 */
        .action-icon.glow-shield {
            text-shadow: 0 0 20px #64b5f6, 0 0 40px #64b5f6; transform: scale(1.1);
        }

        .vs-text { 
            font-size: 18px; color: #e94560; font-style: italic; transition: transform 0.1s ease;
            text-shadow: 0 0 5px rgba(233, 69, 96, 0.5);
        }
        /* 倒數跳動彈跳動畫 */
        .vs-text.countdown { 
            font-size: 30px; color: #fbc02d; 
            animation: bounceNum 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite alternate;
        }
        @keyframes bounceNum {
            from { transform: scale(1); }
            to { transform: scale(1.35); text-shadow: 0 0 15px #fbc02d; }
        }

        /* 操作面板 */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .btn-action {
            background: #2a3b5c; color: white; border: 2px solid #3d5a80;
            padding: 14px 8px; font-size: 14px; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: 0.1s; box-shadow: 0 4px 0 #1a2539;
        }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }
        .btn-action:disabled { background: #1a2539; border-color: #1a2539; color: #555; cursor: not-allowed; box-shadow: none; transform: none; }
        
        .btn-charge { border-color: #2e7d32; color: #81c784; }
        .btn-defend { border-color: #1565c0; color: #64b5f6; }
        .btn-shoot { border-color: #c62828; color: #e57373; }
        .btn-sniper { grid-column: span 2; border-color: #fbc02d; color: #fff59d; background: #5a4b16; }

        /* 對戰日誌與難度選擇 */
        .log-box {
            background: #111a2e; border: 1px solid #2a3b5c; border-radius: 8px;
            height: 70px; overflow-y: auto; padding: 8px; font-size: 12px;
            line-height: 1.5; text-align: center; margin-bottom: 12px; color: #9ab;
        }
        .log-important { color: #fff; font-weight: bold; font-size: 13px; }
        .log-win { color: #4caf50; } .log-lose { color: #f44336; }

        .settings-bar {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; background: #0f3460; padding: 8px 12px; border-radius: 8px;
        }
        select { background: #1a1a2e; color: #fff; border: 1px solid #3d5a80; padding: 6px; border-radius: 6px; font-weight: bold; }
        
        /* 結算重置按鈕 */
        #btn-restart {
            display: none; width: 100%; padding: 12px; font-size: 16px; font-weight: bold;
            background: #e94560; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="red-flash-overlay"></div>
    <button class="btn-home" onclick="window.location.href='index.html'">⬅️ 返回大廳</button>
    <button class="btn-mute" id="btn-mute" onclick="toggleMute()" title="開啟/關閉音效">🔊</button>

    <div id="game-wrap">
        <h2>🕵️ 007 特務對決</h2>
        <div class="subtitle">心理博弈生死戰：誰能看穿對手？</div>

        <!-- 戰鬥舞台 -->
        <div class="battle-stage" id="battle-stage">
            <!-- 敵方對話氣泡 -->
            <div class="speech-bubble" id="enemy-speech">準備好了嗎？</div>

            <!-- Enemy -->
            <div class="agent-card">
                <div class="agent-name"><span id="enemy-emoji">🕶️</span> <span id="txt-enemy-name">暗影王牌殺手</span></div>
                <div class="bullet-belt-container">
                    <div class="bullet-label" id="ai-bullet-label">彈匣：0 / 3</div>
                    <div class="bullet-belt" id="ai-bullets"></div>
                </div>
            </div>

            <!-- 動作揭曉 -->
            <div class="action-reveal">
                <div class="action-icon" id="ai-action-icon">❓</div>
                <div class="vs-text" id="vs-text">VS</div>
                <div class="action-icon" id="player-action-icon">❓</div>
            </div>

            <!-- Player -->
            <div class="agent-card">
                <div class="agent-name" style="color: #64b5f6;">🕶️ 玩家特務</div>
                <div class="bullet-belt-container">
                    <div class="bullet-label" id="player-bullet-label">彈匣：0 / 3</div>
                    <div class="bullet-belt" id="player-bullets"></div>
                </div>
            </div>
        </div>

        <div class="log-box" id="log-box">雙方進入對峙狀態... 第一回合請先【🔋 集氣】填裝子彈！</div>

        <!-- 操作面板 -->
        <div class="controls" id="control-panel">
            <button class="btn-action btn-charge" id="btn-c" onclick="triggerRound('charge')">🔋 集氣 (+1)</button>
            <button class="btn-action btn-defend" id="btn-d" onclick="triggerRound('defend')">🛡️ 防禦 (0)</button>
            <button class="btn-action btn-shoot" id="btn-s" onclick="triggerRound('shoot')" disabled>🔫 射擊 (-1)</button>
            <button class="btn-action btn-sniper" id="btn-sn" onclick="triggerRound('snipe')" disabled>💥 狙擊大招 (-3)</button>
        </div>

        <button id="btn-restart" onclick="initGame()">🔄 尋找下一個目標</button>

        <div class="settings-bar">
            <div>🏆 連勝：<span id="txt-streak" style="color:#fbc02d; font-weight:bold;">0</span></div>
            <select id="sel-difficulty" onchange="changeDifficulty()">
                <option value="easy">對戰目標：菜鳥見習探員</option>
                <option value="normal" selected>對戰目標：暗影王牌殺手</option>
                <option value="hard">對戰目標：幽靈組織首領</option>
            </select>
        </div>
    </div>

<script>
let playerBullets = 0;
let aiBullets = 0;
let winStreak = 0;
let isGameOver = false;
let currentDifficulty = 'normal';
let isProcessing = false;

const logBox = document.getElementById('log-box');
const pIcon = document.getElementById('player-action-icon');
const aIcon = document.getElementById('ai-action-icon');
const vsText = document.getElementById('vs-text');

const ENEMY_PROFILES = {
    'easy': { name: '菜鳥見習探員', emoji: '🕵️' },
    'normal': { name: '暗影王牌殺手', emoji: '🕶️' },
    'hard': { name: '幽靈組織首領', emoji: '🎭' }
};

const ACT_ICONS = {
    'charge': '🔋',
    'defend': '🛡️',
    'shoot': '🔫',
    'snipe': '💥'
};

// --- Web Audio API 音效合成器 ---
let audioCtx;
let isMuted = false;

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function toggleMute() {
    isMuted = !isMuted;
    document.getElementById('btn-mute').innerText = isMuted ? '🔇' : '🔊';
}

function playSound(type) {
    if (isMuted) return;
    initAudio();
    const now = audioCtx.currentTime;

    if (type === 'tick') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.1);
    } 
    else if (type === 'seven') {
        // 最後一拍「7！」較高亢的音效
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.15);
    }
    else if (type === 'charge') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.3);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.3);
    }
    else if (type === 'defend') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.2);
    }
    else if (type === 'shoot' || type === 'snipe') {
        let bufferSize = audioCtx.sampleRate * 0.3;
        let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        let noise = audioCtx.createBufferSource(); noise.buffer = buffer;
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = type === 'snipe' ? 300 : 1200;
        
        let gain = audioCtx.createGain();
        gain.gain.setValueAtTime(type === 'snipe' ? 0.6 : 0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start(now);
    }
}

// --- 遊戲邏輯 ---
function log(msg, className = '') {
    logBox.innerHTML = `<span class="${className}">${msg}</span>`;
}

function showEnemySpeech(text, duration = 2500) {
    const bubble = document.getElementById('enemy-speech');
    bubble.innerText = text; bubble.classList.add('show');
    setTimeout(() => bubble.classList.remove('show'), duration);
}

function initGame() {
    playerBullets = 0; aiBullets = 0; isGameOver = false; isProcessing = false;
    document.getElementById('control-panel').style.display = 'grid';
    document.getElementById('btn-restart').style.display = 'none';
    document.getElementById('game-wrap').classList.remove('shake-active');
    
    pIcon.classList.remove('show', 'glow-shield'); aIcon.classList.remove('show', 'glow-shield');
    vsText.innerText = 'VS'; vsText.classList.remove('countdown');

    updateUI(); log("對局開始！請選擇你的動作。");
    showEnemySpeech("放馬過來吧，菜鳥！", 2000);
    toggleButtons(false);
}

function changeDifficulty() {
    currentDifficulty = document.getElementById('sel-difficulty').value;
    document.getElementById('txt-enemy-name').innerText = ENEMY_PROFILES[currentDifficulty].name;
    document.getElementById('enemy-emoji').innerText = ENEMY_PROFILES[currentDifficulty].emoji;
    winStreak = 0; document.getElementById('txt-streak').innerText = winStreak;
    initGame();
}

function updateUI() {
    let pBelt = document.getElementById('player-bullets'); pBelt.innerHTML = '';
    for(let i=0; i<Math.max(3, playerBullets); i++) {
        pBelt.innerHTML += `<span class="bullet-icon ${i < playerBullets ? 'loaded' : 'empty'}">🟡</span>`;
    }
    document.getElementById('player-bullet-label').innerText = `彈匣：${playerBullets} / 3`;
    
    let aBelt = document.getElementById('ai-bullets'); aBelt.innerHTML = '';
    for(let i=0; i<Math.max(3, aiBullets); i++) {
        aBelt.innerHTML += `<span class="bullet-icon ${i < aiBullets ? 'loaded' : 'empty'}">🟡</span>`;
    }
    document.getElementById('ai-bullet-label').innerText = `彈匣：${aiBullets} / 3`;

    if (!isProcessing) toggleButtons(false);
}

function toggleButtons(disable) {
    document.getElementById('btn-c').disabled = disable;
    document.getElementById('btn-d').disabled = disable;
    document.getElementById('btn-s').disabled = disable || playerBullets < 1;
    document.getElementById('btn-sn').disabled = disable || playerBullets < 3;
}

const delay = ms => new Promise(res => setTimeout(res, ms));

function getAiAction() {
    let canShoot = aiBullets >= 1; let canSnipe = aiBullets >= 3;
    let pCanShoot = playerBullets >= 1; let pCanSnipe = playerBullets >= 3;

    if (aiBullets === 0 && playerBullets === 0) return 'charge';

    if (currentDifficulty === 'easy') {
        let pool = ['charge', 'defend'];
        if (canShoot) pool.push('shoot', 'shoot'); if (canSnipe) pool.push('snipe');
        return pool[Math.floor(Math.random() * pool.length)];
    } 
    else if (currentDifficulty === 'normal') {
        if (aiBullets === 0) return (pCanShoot && Math.random() < 0.6) ? 'defend' : 'charge';
        if (canSnipe) return Math.random() < 0.7 ? 'snipe' : 'shoot';
        if (pCanShoot) {
            let r = Math.random();
            if (r < 0.33) return 'defend'; if (r < 0.66) return 'shoot'; return 'charge';
        } else return Math.random() < 0.6 ? 'shoot' : 'charge';
    } 
    else if (currentDifficulty === 'hard') {
        if (aiBullets === 0) {
            if (pCanSnipe) return 'charge'; 
            return (pCanShoot && Math.random() < 0.8) ? 'defend' : 'charge';
        }
        if (canSnipe) {
            if (pCanSnipe && Math.random() < 0.3) return 'defend'; return 'snipe';
        }
        if (pCanSnipe) return 'shoot';
        if (pCanShoot) return Math.random() < 0.5 ? 'charge' : (Math.random() < 0.5 ? 'defend' : 'shoot');
        else return 'shoot';
    }
}

// 觸發回合 (正確的 0 - 0 - 7 獨立跳出動畫)
async function triggerRound(playerAction) {
    if (isGameOver || isProcessing) return;
    isProcessing = true; toggleButtons(true); initAudio();

    let aiAction = getAiAction();

    pIcon.classList.remove('show', 'glow-shield');
    aIcon.classList.remove('show', 'glow-shield');
    document.getElementById('game-wrap').classList.remove('shake-active');
    
    vsText.classList.add('countdown');
    
    // 第一個 0
    vsText.innerText = "0";
    playSound('tick');
    await delay(450);
    
    // 第二個 0
    vsText.innerText = "0";
    playSound('tick');
    await delay(450);
    
    // 最後的 7 ！
    vsText.innerText = "7 ！";
    playSound('seven');
    
    // 雙方動作同時揭曉
    pIcon.innerText = ACT_ICONS[playerAction];
    aIcon.innerText = ACT_ICONS[aiAction];
    pIcon.classList.add('show');
    aIcon.classList.add('show');
    vsText.classList.remove('countdown');
    
    await delay(250); 
    resolveRound(playerAction, aiAction);
}

function resolveRound(pAct, aAct) {
    let pDead = false; let aDead = false; let resultMsg = ""; let isShootPlayed = false;

    if (pAct === 'shoot' || aAct === 'shoot') { playSound('shoot'); isShootPlayed = true; }
    if (pAct === 'snipe' || aAct === 'snipe') { playSound('snipe'); document.getElementById('game-wrap').classList.add('shake-active'); }
    if (!isShootPlayed && (pAct === 'defend' || aAct === 'defend')) playSound('defend');
    if (pAct === 'charge' || aAct === 'charge') playSound('charge');

    if (aAct === 'shoot') {
        if (pAct === 'charge') { pDead = true; resultMsg += "敵方趁你集氣時開槍！<br>"; }
        else if (pAct === 'defend') { pIcon.classList.add('glow-shield'); }
    } else if (aAct === 'snipe') {
        if (pAct === 'charge' || pAct === 'defend' || pAct === 'shoot') {
            pDead = true; resultMsg += "敵方狙擊大招貫穿了你的防線！<br>";
        }
    }

    if (pAct === 'shoot') {
        if (aAct === 'charge') { aDead = true; resultMsg += "你趁敵方集氣時精準射擊！<br>"; }
        else if (pAct === 'defend') { aIcon.classList.add('glow-shield'); showEnemySpeech("哈哈，早看穿你了！", 2000); }
    } else if (pAct === 'snipe') {
        if (aAct === 'charge' || aAct === 'defend' || aAct === 'shoot') {
            aDead = true; resultMsg += "你的狙擊大招完美擊殺對手！<br>";
        }
    }

    if (pAct === 'shoot' && aAct === 'shoot') resultMsg += "雙方同時開槍，子彈抵銷！";
    if (pAct === 'snipe' && aAct === 'snipe') resultMsg += "雙方同時開啟大招，引發劇烈爆炸抵銷！";
    if (pAct === 'defend' && aAct === 'defend') resultMsg += "雙方都在防禦，氣氛十分尷尬...";
    if (pAct === 'charge' && aAct === 'charge') resultMsg += "雙方都在默默集氣儲備子彈。";
    if (pAct === 'defend' && aAct === 'shoot') resultMsg += "你成功防禦了敵方的射擊！";

    if (pAct === 'shoot') playerBullets--;
    if (pAct === 'snipe') playerBullets -= 3;
    if (aAct === 'shoot') aiBullets--;
    if (aAct === 'snipe') aiBullets -= 3;
    
    if (pAct === 'charge' && !pDead) playerBullets++;
    if (aAct === 'charge' && !aDead) aiBullets++;

    updateUI();

    if (pDead && aDead) {
        document.getElementById('red-flash-overlay').classList.add('flash');
        log("<span class='log-important'>雙方同歸於盡！平手結束！</span>");
        endGame(false);
    } else if (pDead) {
        document.getElementById('red-flash-overlay').classList.add('flash');
        log(resultMsg + "<span class='log-important log-lose'><br>💀 任務失敗，你被擊殺了。</span>");
        showEnemySpeech("就這點能耐嗎？太弱了！", 3000);
        endGame(false);
    } else if (aDead) {
        log(resultMsg + "<span class='log-important log-win'><br>🏆 任務成功！你擊殺了目標！</span>");
        endGame(true);
    } else {
        log(resultMsg); isProcessing = false; toggleButtons(false);
        setTimeout(() => document.getElementById('red-flash-overlay').classList.remove('flash'), 300);
        
        vsText.innerText = 'VS';
        if (playerBullets >= 2 && Math.random() > 0.3) showEnemySpeech("可惡...他子彈快滿了...");
        else if (aiBullets >= 2 && Math.random() > 0.4) showEnemySpeech("準備好受死吧！");
    }
}

function endGame(playerWon) {
    isGameOver = true;
    setTimeout(() => document.getElementById('red-flash-overlay').classList.remove('flash'), 500);
    document.getElementById('control-panel').style.display = 'none';
    document.getElementById('btn-restart').style.display = 'block';

    if (playerWon) {
        winStreak++; document.getElementById('txt-streak').innerText = winStreak;
    } else {
        winStreak = 0; document.getElementById('txt-streak').innerText = winStreak;
    }
}

document.getElementById('txt-enemy-name').innerText = ENEMY_PROFILES[currentDifficulty].name;
initGame();
</script>
</body>
</html>
