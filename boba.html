<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手搖飲搖搖樂</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #fffaf0; /* 奶茶色底色 */
            color: #3e2723;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            touch-action: manipulation;
            user-select: none;
        }

        #game-wrap {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            border: 3px solid #d7ccc8;
            position: relative;
            overflow: hidden;
        }

        h2 { margin: 0 0 12px 0; color: #5d4037; text-align: center; font-size: 22px; }

        /* 頂部狀態列 */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #efebe9;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .stat-value { font-size: 18px; color: #d84315; margin-top: 2px;}

        /* 時間條 */
        .timer-container {
            background: #e0e0e0; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 12px;
        }
        .timer-bar {
            background: #29b6f6; height: 100%; width: 100%; transition: width 1s linear;
        }

        /* 客人與訂單區 */
        .customer-zone {
            background: #fff8e1; border: 2px dashed #ffb300; border-radius: 12px;
            padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; align-items: center;
            min-height: 120px; position: relative;
        }
        .customer-emoji { font-size: 40px; margin-bottom: 4px; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        
        .order-bubble {
            background: white; border: 1px solid #ffcc80; padding: 8px 12px; border-radius: 16px;
            font-size: 14px; font-weight: bold; color: #333; text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05); position: relative; max-width: 90%;
        }
        .order-bubble::after {
            content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            border-width: 0 8px 8px 8px; border-style: solid; border-color: transparent transparent white transparent;
        }
        
        /* 客人耐心條 */
        .patience-container { width: 100%; background: #ffebee; height: 6px; border-radius: 3px; margin-top: 10px; overflow: hidden; }
        .patience-bar { background: #66bb6a; height: 100%; width: 100%; transition: width 0.1s linear, background-color 0.3s; }

        /* 工作區：杯子狀態 */
        .cup-zone {
            background: #f5f5f5; border-radius: 12px; padding: 12px; margin-bottom: 12px;
            text-align: center; border: 2px solid #e0e0e0;
        }
        .cup-title { font-size: 12px; color: #757575; margin-bottom: 6px; font-weight: bold; }
        .cup-status { font-size: 15px; font-weight: bold; color: #4e342e; min-height: 22px; }

        /* 操作按鈕網格 */
        .control-group { margin-bottom: 8px; }
        .group-label { font-size: 11px; font-weight: bold; color: #8d6e63; margin-bottom: 4px; }
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        
        .btn {
            background: #ffffff; color: #3e2723; border: 2px solid #bcaaa4; padding: 8px 4px;
            font-size: 12px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 2px 0 #bcaaa4; transition: 0.1s; text-align: center;
        }
        .btn:active { transform: translateY(2px); box-shadow: none; }
        .btn.active { background: #ffe082; border-color: #ffb300; box-shadow: 0 2px 0 #ffb300; color: #b71c1c; }
        
        .btn-tea { border-color: #a5d6a7; box-shadow: 0 2px 0 #a5d6a7; }
        .btn-tea.active { background: #e8f5e9; border-color: #2e7d32; box-shadow: 0 2px 0 #2e7d32; color: #1b5e20; }
        
        .btn-top { border-color: #ce93d8; box-shadow: 0 2px 0 #ce93d8; }
        .btn-top.active { background: #f3e5f5; border-color: #6a1b9a; box-shadow: 0 2px 0 #6a1b9a; color: #4a148c; }
        
        .btn-sugar { border-color: #ffcc80; box-shadow: 0 2px 0 #ffcc80; }
        .btn-sugar.active { background: #fff3e0; border-color: #ef6c00; box-shadow: 0 2px 0 #ef6c00; color: #e65100; }
        
        .btn-ice { border-color: #90caf9; box-shadow: 0 2px 0 #90caf9; }
        .btn-ice.active { background: #e3f2fd; border-color: #1565c0; box-shadow: 0 2px 0 #1565c0; color: #0d47a1; }

        .action-row { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 12px; }
        .btn-trash { background: #eeeeee; border-color: #9e9e9e; box-shadow: 0 4px 0 #9e9e9e; color: #424242; font-size: 14px; padding: 12px; }
        .btn-serve { background: #ff5252; border-color: #c62828; box-shadow: 0 4px 0 #c62828; color: white; font-size: 16px; padding: 12px; }

        /* 彈窗與浮動特效 */
        .toast {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px;
            font-size: 16px; font-weight: bold; pointer-events: none; opacity: 0; z-index: 100;
        }
        .toast.show { animation: floatUp 1s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1.1); } }

        /* 商店面板 */
        #screen-shop, #screen-start {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fffaf0; z-index: 50; padding: 20px; box-sizing: border-box;
        }
        .shop-item {
            width: 100%; background: #ffffff; border: 2px solid #e0e0e0; padding: 12px; border-radius: 12px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .shop-info h4 { margin: 0 0 4px 0; color: #3e2723; }
        .shop-info p { margin: 0; font-size: 11px; color: #757575; }
        .btn-buy { background: #ffb300; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-buy:disabled { background: #e0e0e0; color: #9e9e9e; cursor: not-allowed; }

        .btn-start {
            background: #4caf50; border: none; box-shadow: 0 4px 0 #2e7d32; color: white;
            font-size: 18px; font-weight: bold; padding: 14px 24px; border-radius: 12px; cursor: pointer; margin-top: 20px; width: 100%;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: none; }

        .btn-home {
            position: fixed; top: 15px; left: 15px; z-index: 99999;
            box-sizing: border-box; height: 36px; padding: 0 14px;
            font-family: system-ui, -apple-system, sans-serif; font-size: 14px;
            font-weight: 600; color: #333333; background-color: #ffffff;
            border: 1px solid #d1d5db; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12); cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-home">⬅️ 返回大廳</a>

    <div id="game-wrap">
        
        <!-- 遊戲開始 / 結束結算畫面 -->
        <div id="screen-start" style="display: flex;">
            <div style="font-size: 60px; margin-bottom: 10px;">🧋</div>
            <h2 style="font-size: 26px;">手搖飲搖搖樂</h2>
            <p style="text-align: center; color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 20px;">
                迎戰台灣手搖飲的尖峰時刻！<br>依照客人的奇怪點單完美調製飲料。<br>賺取營業額來升級你的店面吧！
            </p>
            <div style="background: #fff8e1; border: 2px dashed #ffb300; padding: 12px; border-radius: 12px; width: 100%; text-align: center; margin-bottom: 20px;">
                <div style="font-weight: bold; color: #d84315;">準備進入 第 <span id="txt-ready-day">1</span> 天</div>
                <div style="font-size: 13px; color: #757575; margin-top: 4px;">今日目標營業額：$<span id="txt-ready-target">300</span></div>
            </div>
            <button class="btn-start" onclick="startGame()">▶️ 開始營業！</button>
            <button class="btn" style="width:100%; margin-top: 10px; padding:12px; background:#eeeeee;" onclick="askReset()">🔄 清除進度重開</button>
        </div>

        <!-- 商店畫面 -->
        <div id="screen-shop">
            <h2 style="margin-bottom: 5px;">🏪 收攤進貨</h2>
            <p style="font-size: 13px; color: #d84315; font-weight: bold; margin-bottom: 16px;">目前資金：$<span id="txt-shop-money">0</span></p>
            
            <div class="shop-item">
                <div class="shop-info">
                    <h4>❄️ 頂級冷氣空調</h4>
                    <p>客人等候耐心上限增加 30%</p>
                </div>
                <button class="btn-buy" id="btn-buy-ac" onclick="buyUpgrade('ac', 800)">$800</button>
            </div>
            <div class="shop-item">
                <div class="shop-info">
                    <h4>🍃 嚴選小農茶葉</h4>
                    <p>每杯飲料基礎售價提高 $15</p>
                </div>
                <button class="btn-buy" id="btn-buy-tea" onclick="buyUpgrade('tea', 1200)">$1200</button>
            </div>
            <div class="shop-item">
                <div class="shop-info">
                    <h4>🤖 自動封膜機</h4>
                    <p>出餐超快速！每杯額外獲得 $10 小費</p>
                </div>
                <button class="btn-buy" id="btn-buy-seal" onclick="buyUpgrade('seal', 2000)">$2000</button>
            </div>

            <button class="btn-start" style="margin-top: 20px;" onclick="nextDayPrep()">▶️ 準備迎接隔天</button>
        </div>

        <!-- 遊戲主畫面 -->
        <div id="screen-game" style="display: none;">
            <div class="stats-bar">
                <div class="stat-item"><span style="color: #757575; font-size: 11px;">天數</span><span class="stat-value" style="color:#2b5876;" id="val-day">1</span></div>
                <div class="stat-item"><span style="color: #757575; font-size: 11px;">目標</span><span class="stat-value" id="val-target">300</span></div>
                <div class="stat-item"><span style="color: #757575; font-size: 11px;">營收</span><span class="stat-value" style="color:#2e7d32;" id="val-money">0</span></div>
            </div>

            <div class="timer-container"><div class="timer-bar" id="ui-timer"></div></div>

            <div class="customer-zone">
                <div class="customer-emoji" id="c-emoji">👤</div>
                <div class="order-bubble" id="c-order">等待客人上門...</div>
                <div class="patience-container"><div class="patience-bar" id="c-patience"></div></div>
            </div>

            <div class="cup-zone">
                <div class="cup-title">🥤 目前杯中狀態：</div>
                <div class="cup-status" id="ui-cup-status">空空如也</div>
            </div>

            <div class="controls-panel">
                <div class="control-group">
                    <div class="group-label">【選擇茶底】(單選)</div>
                    <div class="btn-grid" id="grid-base">
                        <button class="btn btn-tea" onclick="setCup('base', '紅茶')">🫖 紅茶</button>
                        <button class="btn btn-tea" onclick="setCup('base', '綠茶')">🍃 綠茶</button>
                        <button class="btn btn-tea" onclick="setCup('base', '烏龍')">🍂 烏龍</button>
                        <button class="btn btn-tea" onclick="setCup('base', '鮮奶')">🥛 鮮奶</button>
                    </div>
                </div>
                <div class="control-group">
                    <div class="group-label">【添加配料】(可複選)</div>
                    <div class="btn-grid" id="grid-topping">
                        <button class="btn btn-top" onclick="toggleTopping('珍珠')">⚫ 珍珠</button>
                        <button class="btn btn-top" onclick="toggleTopping('椰果')">⬜ 椰果</button>
                        <button class="btn btn-top" onclick="toggleTopping('布丁')">🍮 布丁</button>
                        <button class="btn btn-top" onclick="toggleTopping('奶蓋')">☁️ 奶蓋</button>
                    </div>
                </div>
                <div class="control-group">
                    <div class="group-label">【甜度】(單選)</div>
                    <div class="btn-grid" id="grid-sugar">
                        <button class="btn btn-sugar" onclick="setCup('sugar', '無糖')">無糖</button>
                        <button class="btn btn-sugar" onclick="setCup('sugar', '微糖')">微糖</button>
                        <button class="btn btn-sugar" onclick="setCup('sugar', '半糖')">半糖</button>
                        <button class="btn btn-sugar" onclick="setCup('sugar', '全糖')">全糖</button>
                    </div>
                </div>
                <div class="control-group">
                    <div class="group-label">【冰塊】(單選)</div>
                    <div class="btn-grid" id="grid-ice">
                        <button class="btn btn-ice" onclick="setCup('ice', '去冰')">去冰</button>
                        <button class="btn btn-ice" onclick="setCup('ice', '微冰')">微冰</button>
                        <button class="btn btn-ice" onclick="setCup('ice', '少冰')">少冰</button>
                        <button class="btn btn-ice" onclick="setCup('ice', '正常冰')">正常冰</button>
                    </div>
                </div>
                
                <div class="action-row">
                    <button class="btn btn-trash" onclick="resetCup()">🗑️ 倒掉</button>
                    <button class="btn btn-serve" onclick="serveDrink()">🥤 封膜出餐</button>
                </div>
            </div>
        </div>

        <div id="sys-toast" class="toast"></div>
    </div>

<script>
// 遊戲資料存檔結構
let save = {
    day: 1,
    money: 0,
    upgrades: { ac: false, tea: false, seal: false }
};

// 遊戲狀態與常數
let gameState = 'start'; // start, playing, shop
let targetMoney = 300;
let todayRevenue = 0;
let gameTimer = 60;
let gameInterval;
let customerInterval;

let currentOrder = null;
let currentCup = { base: '', toppings: [], sugar: '', ice: '' };
let patience = 100;
let patienceDropRate = 1.5; // 每 0.1 秒掉的耐心值

const BASES = ['紅茶', '綠茶', '烏龍', '鮮奶'];
const TOPPINGS = ['珍珠', '椰果', '布丁', '奶蓋'];
const SUGARS = ['無糖', '微糖', '半糖', '全糖'];
const ICES = ['去冰', '微冰', '少冰', '正常冰'];
const CUSTOMER_EMOJIS = ['👨', '👩', '🧑‍🎓', '👨‍💼', '👵', '👱‍♀️'];

// --- 存檔系統 ---
function saveGame() {
    localStorage.setItem('bobaSave', JSON.stringify(save));
}
function loadGame() {
    let s = localStorage.getItem('bobaSave');
    if (s) {
        save = JSON.parse(s);
        document.getElementById('txt-ready-day').innerText = save.day;
        targetMoney = 300 + (save.day - 1) * 250;
        document.getElementById('txt-ready-target').innerText = targetMoney;
    }
}
function askReset() {
    if(confirm("確定要放棄這家店，清空資金與升級從第 1 天重來嗎？")) {
        localStorage.removeItem('bobaSave');
        location.reload();
    }
}
// ----------------

function showToast(msg, isGood = true) {
    let t = document.getElementById('sys-toast');
    t.innerText = msg;
    t.style.background = isGood ? 'rgba(76, 175, 80, 0.9)' : 'rgba(244, 67, 54, 0.9)';
    t.classList.remove('show');
    void t.offsetWidth; // 觸發重繪
    t.classList.add('show');
}

function updateShopUI() {
    document.getElementById('txt-shop-money').innerText = save.money;
    let bAc = document.getElementById('btn-buy-ac');
    let bTea = document.getElementById('btn-buy-tea');
    let bSeal = document.getElementById('btn-buy-seal');
    
    if (save.upgrades.ac) { bAc.innerText = "已擁有"; bAc.disabled = true; }
    else { bAc.disabled = save.money < 800; }
    
    if (save.upgrades.tea) { bTea.innerText = "已擁有"; bTea.disabled = true; }
    else { bTea.disabled = save.money < 1200; }
    
    if (save.upgrades.seal) { bSeal.innerText = "已擁有"; bSeal.disabled = true; }
    else { bSeal.disabled = save.money < 2000; }
}

function buyUpgrade(type, price) {
    if (save.money >= price && !save.upgrades[type]) {
        save.money -= price;
        save.upgrades[type] = true;
        saveGame();
        updateShopUI();
        showToast("✨ 升級購買成功！");
    }
}

function nextDayPrep() {
    save.day++;
    saveGame();
    document.getElementById('screen-shop').style.display = 'none';
    document.getElementById('screen-start').style.display = 'flex';
    document.getElementById('txt-ready-day').innerText = save.day;
    targetMoney = 300 + (save.day - 1) * 250;
    document.getElementById('txt-ready-target').innerText = targetMoney;
}

// --- 核心遊戲邏輯 ---
function startGame() {
    document.getElementById('screen-start').style.display = 'none';
    document.getElementById('screen-game').style.display = 'block';
    
    gameState = 'playing';
    todayRevenue = 0;
    gameTimer = 60;
    document.getElementById('val-day').innerText = save.day;
    document.getElementById('val-target').innerText = targetMoney;
    document.getElementById('val-money').innerText = save.money; // 顯示總資產
    
    resetCup();
    spawnCustomer();
    
    // 主時間倒數 (每秒)
    document.getElementById('ui-timer').style.width = '100%';
    gameInterval = setInterval(() => {
        gameTimer--;
        document.getElementById('ui-timer').style.width = (gameTimer / 60 * 100) + '%';
        if (gameTimer <= 0) endDay();
    }, 1000);
    
    // 客人耐心倒數 (每 0.1 秒)
    customerInterval = setInterval(() => {
        if (!currentOrder) return;
        patience -= patienceDropRate;
        let pBar = document.getElementById('c-patience');
        pBar.style.width = Math.max(0, patience) + '%';
        pBar.style.backgroundColor = patience > 50 ? '#66bb6a' : patience > 20 ? '#ffa726' : '#ef5350';
        
        if (patience <= 0) {
            // 客人生氣走掉
            showToast("💢 客人等太久氣走了！", false);
            spawnCustomer();
        }
    }, 100);
}

function spawnCustomer() {
    resetCup();
    patience = 100;
    let baseDrop = save.upgrades.ac ? 1.0 : 1.5; // 冷氣升級減緩耐心下降
    patienceDropRate = baseDrop + (save.day * 0.1); // 每天稍微加快
    
    let emoji = CUSTOMER_EMOJIS[Math.floor(Math.random() * CUSTOMER_EMOJIS.length)];
    let typeRoll = Math.random();
    
    currentOrder = { type: 'normal', base: '', toppings: [], sugar: '', ice: '', text: '' };
    
    if (typeRoll < 0.1 && save.day >= 2) {
        // 大冰奶傳說 (鮮奶 + 全糖 + 正常冰)
        emoji = '😎';
        patienceDropRate *= 0.8; // 讓他等久一點
        currentOrder.base = '鮮奶';
        currentOrder.sugar = '全糖';
        currentOrder.ice = '正常冰';
        currentOrder.text = "老闆！我要一杯傳說中的大冰奶，今早急需通腸胃！";
    } 
    else if (typeRoll < 0.25 && save.day >= 3) {
        // 奧客：選擇障礙
        emoji = '🤔';
        currentOrder.base = BASES[Math.floor(Math.random() * BASES.length)];
        currentOrder.ice = ICES[Math.floor(Math.random() * ICES.length)];
        currentOrder.sugar = Math.random() > 0.5 ? '無糖' : '微糖'; // 隨便配
        currentOrder.text = `給我一杯 ${currentOrder.ice} 的 ${currentOrder.base}，不要太甜，不加料。`;
    }
    else if (typeRoll < 0.4) {
        // 趕時間外送員
        emoji = '🛵';
        patienceDropRate *= 2.5; // 掉超快
        currentOrder.type = 'rush';
        currentOrder.base = BASES[Math.floor(Math.random() * BASES.length)];
        currentOrder.sugar = SUGARS[Math.floor(Math.random() * SUGARS.length)];
        currentOrder.ice = ICES[Math.floor(Math.random() * ICES.length)];
        currentOrder.text = `外送取餐！581號！${currentOrder.sugar} ${currentOrder.ice} 的 ${currentOrder.base}，快點！`;
    }
    else {
        // 正常客人
        currentOrder.base = BASES[Math.floor(Math.random() * BASES.length)];
        currentOrder.sugar = SUGARS[Math.floor(Math.random() * SUGARS.length)];
        currentOrder.ice = ICES[Math.floor(Math.random() * ICES.length)];
        
        if (Math.random() > 0.4) {
            let top = TOPPINGS[Math.floor(Math.random() * TOPPINGS.length)];
            currentOrder.toppings.push(top);
            currentOrder.text = `我要一杯 ${currentOrder.sugar}${currentOrder.ice} 的 ${top}${currentOrder.base}。`;
        } else {
            currentOrder.text = `我要一杯 ${currentOrder.sugar}${currentOrder.ice} 的 ${currentOrder.base}。`;
        }
    }
    
    document.getElementById('c-emoji').innerText = emoji;
    document.getElementById('c-order').innerText = currentOrder.text;
}

// --- 杯子操作 ---
function setCup(prop, val) {
    if(gameState !== 'playing') return;
    currentCup[prop] = val;
    renderCupUI();
}
function toggleTopping(val) {
    if(gameState !== 'playing') return;
    let idx = currentCup.toppings.indexOf(val);
    if(idx > -1) currentCup.toppings.splice(idx, 1);
    else {
        if(currentCup.toppings.length < 2) currentCup.toppings.push(val);
        else showToast("杯子滿了！最多只能加 2 種配料喔", false);
    }
    renderCupUI();
}
function resetCup() {
    currentCup = { base: '', toppings: [], sugar: '', ice: '' };
    renderCupUI();
}

function renderCupUI() {
    // 渲染按鈕狀態
    document.querySelectorAll('.btn-tea').forEach(b => b.classList.toggle('active', b.innerText.includes(currentCup.base) && currentCup.base !== ''));
    document.querySelectorAll('.btn-sugar').forEach(b => b.classList.toggle('active', b.innerText === currentCup.sugar));
    document.querySelectorAll('.btn-ice').forEach(b => b.classList.toggle('active', b.innerText === currentCup.ice));
    
    document.querySelectorAll('.btn-top').forEach(b => {
        let isHas = false;
        currentCup.toppings.forEach(t => { if(b.innerText.includes(t)) isHas = true; });
        b.classList.toggle('active', isHas);
    });

    // 渲染杯中文字
    let parts = [];
    if(currentCup.base) parts.push(currentCup.base);
    if(currentCup.toppings.length > 0) parts.push(...currentCup.toppings);
    if(currentCup.sugar) parts.push(currentCup.sugar);
    if(currentCup.ice) parts.push(currentCup.ice);
    
    let txt = parts.join(' + ');
    document.getElementById('ui-cup-status').innerHTML = txt === '' ? '<span style="color:#bdbdbd;">空空如也</span>' : txt;
}

function serveDrink() {
    if(gameState !== 'playing') return;
    if(!currentCup.base || !currentCup.sugar || !currentCup.ice) {
        showToast("🚧 飲料還沒做好啦！(需茶底、甜度、冰塊)", false);
        return;
    }

    // 驗證邏輯
    let isMatch = true;
    if (currentCup.base !== currentOrder.base) isMatch = false;
    if (currentCup.sugar !== currentOrder.sugar) isMatch = false;
    if (currentCup.ice !== currentOrder.ice) isMatch = false;
    
    let cupTop = [...currentCup.toppings].sort().join();
    let orderTop = [...currentOrder.toppings].sort().join();
    if (cupTop !== orderTop) isMatch = false;

    if (isMatch) {
        // 算錢
        let price = 40; // 基礎售價
        if (currentOrder.toppings.length > 0) price += 10 * currentOrder.toppings.length;
        if (save.upgrades.tea) price += 15;
        if (save.upgrades.seal) price += 10; // 自動封膜小費
        if (currentOrder.type === 'rush' && patience > 50) price += 20; // 外送員神速小費

        todayRevenue += price;
        save.money += price;
        document.getElementById('val-money').innerText = save.money;
        
        showToast(`🎉 完美！賺取 $${price}`);
        document.getElementById('c-emoji').innerText = '😍';
        document.getElementById('c-order').innerText = "太好喝了！謝謝老闆！";
        
        setTimeout(spawnCustomer, 600); // 稍微延遲看笑臉
    } else {
        showToast("💢 做錯了啦！這不是我點的！", false);
        document.getElementById('c-emoji').innerText = '😡';
        document.getElementById('c-order').innerText = "我要去留一星負評！！！";
        patience = 0; // 強制生氣走人
        setTimeout(spawnCustomer, 800);
    }
}

function endDay() {
    gameState = 'over';
    clearInterval(gameInterval);
    clearInterval(customerInterval);
    
    if (todayRevenue >= targetMoney) {
        alert(`🌅 第 ${save.day} 天營業結束！\n本日目標：$${targetMoney}\n本日營收：$${todayRevenue}\n🎉 順利達標！將進入收攤進貨。`);
        saveGame();
        document.getElementById('screen-game').style.display = 'none';
        document.getElementById('screen-shop').style.display = 'flex';
        updateShopUI();
    } else {
        alert(`💔 營業額未達標...\n本日營收僅有 $${todayRevenue} (目標 $${targetMoney})\n店鋪面臨倒閉危機，請再挑戰一次這一天！`);
        // 不存檔 day++，保留重試
        document.getElementById('screen-game').style.display = 'none';
        document.getElementById('screen-start').style.display = 'flex';
    }
}

// 初始化載入
loadGame();

// 綁定 PWA 腳本 (若單獨執行此檔測試時不報錯)
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
}
</script>
