<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>經典圈圈叉叉</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        #tictactoe-wrap {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 320px;
            width: 100%;
            text-align: center;
            margin-top: 40px;
        }

        .cell {
            width: 75px;
            height: 75px;
            font-size: 38px;
            font-weight: bold;
            background: transparent;
            cursor: pointer;
            user-select: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        /* 經典井字分割線 */
        #c0 { border-right: 3px solid #546e7a; border-bottom: 3px solid #546e7a; border-top: none; border-left: none; }
        #c1 { border-right: 3px solid #546e7a; border-bottom: 3px solid #546e7a; border-top: none; border-left: none; }
        #c2 { border-bottom: 3px solid #546e7a; border-top: none; border-right: none; border-left: none; }

        #c3 { border-right: 3px solid #546e7a; border-bottom: 3px solid #546e7a; border-top: none; border-left: none; }
        #c4 { border-right: 3px solid #546e7a; border-bottom: 3px solid #546e7a; border-top: none; border-left: none; }
        #c5 { border-bottom: 3px solid #546e7a; border-top: none; border-right: none; border-left: none; }

        #c6 { border-right: 3px solid #546e7a; border-top: none; border-bottom: none; border-left: none; }
        #c7 { border-right: 3px solid #546e7a; border-top: none; border-bottom: none; border-left: none; }
        #c8 { border: none; }

        .cell:hover {
            background: rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body>

    <!-- 像素級統一的懸浮返回大廳按鈕 -->
    <button onclick="window.location.href='index.html'" style="all: unset; position: fixed; top: 15px; left: 15px; z-index: 99999; box-sizing: border-box; height: 36px; padding: 0 14px; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; color: #333333; background-color: #ffffff; border: 1px solid #d1d5db; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.12); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none;">
        ⬅️ 返回大廳
    </button>

    <div id="tictactoe-wrap">
        <h2 style="margin: 0 0 6px 0; color: #37474f;">🎮 圈圈叉叉</h2>

        <div style="font-size: 14px; font-weight: bold; color: #555; margin-bottom: 12px;">
            玩家：<span style="color: #1976d2; font-size: 18px;">X</span> ｜ 電腦：<span style="color: #d32f2f; font-size: 18px;">O</span>
        </div>

        <!-- 難度選擇選單 -->
        <div style="margin-bottom: 12px; font-weight: bold; color: #555; background: #eee; padding: 6px; border-radius: 8px; display: inline-block;">
            🧠 難度：
            <select id="difficulty" onchange="resetGame()" style="border: 1px solid #ccc; background: white; padding: 4px; font-weight: bold; border-radius: 4px; cursor: pointer;">
                <option value="easy">🟢 簡單 (隨機亂下)</option>
                <option value="normal" selected>🟡 中等 (偶爾放水)</option>
                <option value="hard">🔴 困難 (絕對無敵)</option>
            </select>
        </div>

        <div id="status-msg" style="font-size: 14px; color: #1976d2; height: 22px; font-weight: bold;">👉 請點擊任意空格落子</div>

        <!-- 3x3 經典井字邊框棋盤 -->
        <div style="display: grid; grid-template-columns: repeat(3, 75px); justify-content: center; margin: 12px auto 16px auto;">
            <button class="cell" id="c0" onclick="playerMove(0)"></button>
            <button class="cell" id="c1" onclick="playerMove(1)"></button>
            <button class="cell" id="c2" onclick="playerMove(2)"></button>
            <button class="cell" id="c3" onclick="playerMove(3)"></button>
            <button class="cell" id="c4" onclick="playerMove(4)"></button>
            <button class="cell" id="c5" onclick="playerMove(5)"></button>
            <button class="cell" id="c6" onclick="playerMove(6)"></button>
            <button class="cell" id="c7" onclick="playerMove(7)"></button>
            <button class="cell" id="c8" onclick="playerMove(8)"></button>
        </div>

        <button id="reset-btn" onclick="resetGame()" style="background: #e65100; color: white; border: none; padding: 10px 22px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%;">
            🔄 重新開始
        </button>
    </div>

<script>
let board = ["", "", "", "", "", "", "", "", ""];
let gameOver = false;
let isAiThinking = false;

const winPatterns = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
];

function checkWin(b, player) {
    return winPatterns.some(pattern => pattern.every(idx => b[idx] === player));
}

function isFull(b) {
    return b.every(cell => cell !== "");
}

function playerMove(index) {
    if (gameOver || isAiThinking || board[index] !== "") return;

    board[index] = "X";
    renderCell(index, "X", "#1976d2");

    if (checkWin(board, "X")) {
        gameOver = true;
        document.getElementById('status-msg').innerHTML = "<span style='color: #2e7d32;'>🎉 恭喜！你成功擊敗了電腦！🏆</span>";
        return;
    }

    if (isFull(board)) {
        gameOver = true;
        document.getElementById('status-msg').innerHTML = "<span style='color: #555;'>🤝 平手！勢均力敵！</span>";
        return;
    }

    isAiThinking = true;
    document.getElementById('status-msg').innerHTML = "<span style='color: #757575;'>🤖 電腦正在思考...</span>";
    setTimeout(aiMove, 300);
}

function aiMove() {
    if (gameOver) {
        isAiThinking = false;
        return;
    }

    let emptyIndices = [];
    for (let i = 0; i < 9; i++) {
        if (board[i] === "") emptyIndices.push(i);
    }

    let move = -1;
    let difficulty = document.getElementById('difficulty').value;

    let playRandomly = false;
    if (difficulty === 'easy') {
        playRandomly = true;
    } else if (difficulty === 'normal') {
        if (Math.random() < 0.4) playRandomly = true;
    }

    if (playRandomly) {
        move = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
    } else {
        // 1. 電腦能贏直接下
        for (let i of emptyIndices) {
            let copy = [...board];
            copy[i] = "O";
            if (checkWin(copy, "O")) { move = i; break; }
        }

        // 2. 玩家下一步要贏則封堵
        if (move === -1) {
            for (let i of emptyIndices) {
                let copy = [...board];
                copy[i] = "X";
                if (checkWin(copy, "X")) { move = i; break; }
            }
        }

        // 3. 佔中心
        if (move === -1 && emptyIndices.includes(4)) {
            move = 4;
        }

        // 4. 佔角落
        if (move === -1) {
            let corners = [0, 2, 6, 8].filter(c => emptyIndices.includes(c));
            if (corners.length > 0) {
                move = corners[Math.floor(Math.random() * corners.length)];
            }
        }

        // 5. 隨機下剩餘邊格
        if (move === -1 && emptyIndices.length > 0) {
            move = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        }
    }

    if (move !== -1) {
        board[move] = "O";
        renderCell(move, "O", "#d32f2f");

        if (checkWin(board, "O")) {
            gameOver = true;
            document.getElementById('status-msg').innerHTML = "<span style='color: #c62828;'>💀 電腦連線獲勝！再挑戰一局吧！</span>";
            isAiThinking = false;
            return;
        }

        if (isFull(board)) {
            gameOver = true;
            document.getElementById('status-msg').innerHTML = "<span style='color: #555;'>🤝 平手！棋盤已滿。</span>";
            isAiThinking = false;
            return;
        }

        document.getElementById('status-msg').innerHTML = "👉 輪到你落子！";
    }

    isAiThinking = false;
}

function renderCell(idx, symbol, color) {
    let btn = document.getElementById("c" + idx);
    btn.innerText = symbol;
    btn.style.color = color;
}

function resetGame() {
    board = ["", "", "", "", "", "", "", "", ""];
    gameOver = false;
    isAiThinking = false;
    for (let i = 0; i < 9; i++) {
        let btn = document.getElementById("c" + i);
        btn.innerText = "";
    }
    document.getElementById('status-msg').innerHTML = "👉 遊戲已重置，請點擊任意空格落子！";
}
</script>
</body>
</html>
