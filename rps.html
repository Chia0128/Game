<script>
// ================= 全域變數 =================
let roomCode = "";
let myName = "";
let oppName = "對手";
let baseUrl = "";
let eventSource = null;

let isHost = false;
let myRole = "";
let oppRole = "";

let myScore = 0;
let oppScore = 0;
let roundNum = 1;
let myChoice = null;
let oppChoice = null;
let gameStarted = false;

const msgBox = document.getElementById('game-msg');
const handBtns = document.getElementById('hand-buttons');

// ================= 1. 連線與進房邏輯 =================
async function joinRoom() {
    roomCode = document.getElementById('room-input').value.trim();
    myName = document.getElementById('name-input').value.trim() || "玩家";
    
    if (!roomCode) {
        alert("請輸入房間代號！");
        return;
    }
    
    baseUrl = `https://ntfy.sh/${roomCode}`;
    
    // 切換到大廳
    document.getElementById('login-screen').classList.remove('active');
    document.getElementById('lobby-screen').classList.add('active');
    document.getElementById('lobby-my-name').innerText = myName;
    document.getElementById('lobby-room').innerText = roomCode;

    // 探測房間狀態
    try {
        let res = await fetch(`${baseUrl}/json?poll=1`);
        let text = await res.text();
        let lines = text.trim().split('\n').filter(Boolean);
        
        let roomReady = false;
        if (lines.length > 0) {
            let lastMsg = JSON.parse(lines[lines.length - 1]);
            let content = JSON.parse(lastMsg.message || "{}");
            if (content.action === 'waiting') {
                isHost = false;
                myRole = "p2";
                oppRole = "p1";
                oppName = content.data.name || "玩家 1";
                roomReady = true;
            }
        }
        
        if (!roomReady) {
            isHost = true;
            myRole = "p1";
            oppRole = "p2";
            sendMsg('waiting', { name: myName });
        } else {
            sendMsg('join', { name: myName });
        }
        
        startListening();
        
    } catch (e) {
        alert("連線發生錯誤，請重試！");
        location.reload();
    }
}

// ================= 2. 訊息發送與接收 =================
function sendMsg(action, data) {
    fetch(baseUrl, {
        method: 'POST',
        headers: { "X-Retain": "1" },
        body: JSON.stringify({ sender: myRole, action: action, data: data })
    }).catch(()=>{});
}

function startListening() {
    // 使用 SSE (Server-Sent Events) 保持長連線監聽
    eventSource = new EventSource(`${baseUrl}/sse`);
    
    eventSource.onmessage = (e) => {
        try {
            let parsed = JSON.parse(e.data);
            if (!parsed.message) return;
            
            let content = JSON.parse(parsed.message);
            let sender = content.sender;
            let action = content.action;
            let data = content.data;
            
            if (sender === oppRole) {
                if (action === 'join' && isHost) {
                    oppName = data.name;
                    sendMsg('start', { name: myName });
                    startGameUI();
                } else if (action === 'start' && !isHost) {
                    oppName = data.name;
                    startGameUI();
                } else if (action === 'choice') {
                    if (data.round === roundNum) {
                        oppChoice = data.choice;
                        checkRoundResult();
                    }
                } else if (action === 'round_end' && !isHost) {
                    if (data.round === roundNum) {
                        handleGuestResult(data);
                    }
                } else if (action === 'play_again') {
                    // 接收到對手的「再玩一局」要求，瞬間重置狀態
                    resetGameState();
                    startRound();
                }
            }
        } catch (err) {}
    };
}

// ================= 3. 遊戲流程 =================
function startGameUI() {
    gameStarted = true;
    document.getElementById('lobby-screen').classList.remove('active');
    document.getElementById('game-screen').classList.add('active');
    
    document.getElementById('my-name-display').innerText = myName;
    document.getElementById('opp-name-display').innerText = oppName;
    
    startRound();
}

function startRound() {
    myChoice = null;
    oppChoice = null;
    document.getElementById('round-num').innerText = roundNum;
    
    // 重置按鈕樣式
    Array.from(handBtns.children).forEach(btn => {
        btn.classList.remove('selected');
        btn.disabled = false;
    });
    
    msgBox.innerHTML = `👉 <span style="color:#1976d2">請選擇要出的拳！</span>`;
    handBtns.style.display = 'flex';
}

// 玩家點擊按鈕出拳
window.makeChoice = function(choice) {
    if (myChoice) return; // 已經出過了
    
    myChoice = choice;
    
    // 鎖定按鈕與樣式
    Array.from(handBtns.children).forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === choice) btn.classList.add('selected');
    });
    
    msgBox.innerHTML = `✔️ 你出了 <b>${choice}</b>，等待對手...`;
    
    sendMsg('choice', { round: roundNum, choice: myChoice });
    checkRoundResult();
}

// 房主負責結算並廣播
function checkRoundResult() {
    if (myChoice && oppChoice && isHost) {
        let resultMsg = "";
        
        if (myChoice === oppChoice) {
            resultMsg = `<div class="result-anim">🤝 雙方都出 ${myChoice}，平手！</div>`;
        } else if (
            (myChoice === '✌️' && oppChoice === '✋') ||
            (myChoice === '✊' && oppChoice === '✌️') ||
            (myChoice === '✋' && oppChoice === '✊')
        ) {
            myScore++;
            resultMsg = `<div class="result-anim" style="color:var(--success)">🎉 ${myChoice} 贏 ${oppChoice}，你贏了這回合！</div>`;
        } else {
            oppScore++;
            resultMsg = `<div class="result-anim" style="color:#d32f2f">😭 ${myChoice} 輸 ${oppChoice}，對手得分！</div>`;
        }
        
        updateScores();
        msgBox.innerHTML = resultMsg;
        
        sendMsg('round_end', {
            round: roundNum,
            host_choice: myChoice,
            guest_choice: oppChoice,
            host_score: myScore,
            guest_score: oppScore
        });
        
        setTimeout(nextRoundCheck, 2500);
    } else if (myChoice && oppChoice && !isHost) {
        msgBox.innerHTML = `⏳ 雙方已出拳，結算中...`;
    }
}

// 房客接收房主結算結果
function handleGuestResult(data) {
    oppChoice = data.host_choice;
    myScore = data.guest_score;
    oppScore = data.host_score;
    
    let resultMsg = "";
    if (myChoice === oppChoice) {
        resultMsg = `<div class="result-anim">🤝 雙方都出 ${myChoice}，平手！</div>`;
    } else if (myScore > parseInt(document.getElementById('my-score').innerText)) {
        resultMsg = `<div class="result-anim" style="color:var(--success)">🎉 ${myChoice} 贏 ${oppChoice}，你贏了這回合！</div>`;
    } else {
        resultMsg = `<div class="result-anim" style="color:#d32f2f">😭 ${myChoice} 輸 ${oppChoice}，對手得分！</div>`;
    }
    
    updateScores();
    msgBox.innerHTML = resultMsg;
    
    setTimeout(nextRoundCheck, 2500);
}

function updateScores() {
    document.getElementById('my-score').innerText = myScore;
    document.getElementById('opp-score').innerText = oppScore;
}

// ================= 4. 遊戲結束與重置邏輯 =================
function nextRoundCheck() {
    if (myScore >= 2 || oppScore >= 2) {
        let winner = myScore >= 2 ? "你" : oppName;
        let color = myScore >= 2 ? "var(--success)" : "#d32f2f";
        msgBox.innerHTML = `<div style="font-size:20px; color:${color}; margin-bottom: 10px;">🏁 遊戲結束！<br>🏆 恭喜 <b>${winner}</b> 獲得最終勝利！</div>`;
        handBtns.style.display = 'none';
        
        // 加上並排的「再玩一局」與「離開房間」按鈕
        setTimeout(() => {
            msgBox.innerHTML += `
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                <button onclick="playAgain()" style="background: var(--primary); width: auto; padding: 10px 16px;">🔄 再玩一局</button>
                <button onclick="leaveRoom()" style="background: #9e9e9e; width: auto; padding: 10px 16px;">🚪 離開房間</button>
            </div>`;
        }, 1500);
    } else {
        roundNum++;
        startRound();
    }
}

// 點擊再玩一局
window.playAgain = function() {
    resetGameState();
    sendMsg('play_again', {}); // 通知對手一起重置
    startRound();
}

// 點擊離開房間
window.leaveRoom = function() {
    window.location.href = 'index.html'; // 導回你的遊戲大廳
}

// 清空分數與回合狀態
function resetGameState() {
    myScore = 0;
    oppScore = 0;
    roundNum = 1;
    updateScores();
}
</script>

<button onclick="window.location.href='index.html'" style="position: fixed; top: 15px; left: 15px; z-index: 9999; background: #ffffff; color: #333; border: 1px solid #ddd; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15);">
    ⬅️ 返回大廳
</button>
