<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日神諭占卜</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            touch-action: manipulation;
        }

        #game-wrap {
            background: rgba(30, 27, 46, 0.9);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-width: 360px;
            width: 100%;
            text-align: center;
            margin-top: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }

        h2 { margin: 0 0 6px 0; color: #ffd166; font-size: 22px; }
        .tagline { font-size: 12px; color: #b8b5c9; margin-bottom: 16px; }

        /* 水晶球展示區 */
        .crystal-zone {
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 16px;
        }

        .crystal-ball {
            font-size: 72px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            filter: drop-shadow(0 0 16px rgba(255, 209, 102, 0.4));
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .crystal-ball.animating {
            animation: crystalShake 1s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 28px rgba(239, 71, 111, 0.8));
        }

        @keyframes crystalShake {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(6deg); }
            100% { transform: scale(1.08) rotate(-6deg); }
        }

        /* 籤詩卡片 */
        #fortune-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            display: none;
            text-align: left;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fortune-rank {
            font-size: 18px;
            font-weight: bold;
            color: #ffd166;
            margin-bottom: 8px;
            text-align: center;
        }
        .fortune-desc {
            font-size: 13px;
            line-height: 1.6;
            color: #f1f2f6;
            margin-bottom: 10px;
        }
        .fortune-lucky {
            font-size: 12px;
            color: #06d6a0;
            background: rgba(6, 214, 160, 0.1);
            padding: 6px 10px;
            border-radius: 6px;
            border-left: 3px solid #06d6a0;
        }

        /* 操作按鈕 */
        .btn-divine {
            background: linear-gradient(135deg, #ffd166 0%, #f77f00 100%);
            color: #1f1c2c;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(247, 127, 0, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-divine:active { transform: scale(0.97); }
        .btn-divine:disabled {
            background: #4a455a;
            color: #8c889b;
            cursor: not-allowed;
            box-shadow: none;
        }

        .daily-tip {
            font-size: 11px;
            color: #a4b0be;
            margin-top: 10px;
        }

        .test-reset-btn {
            background: none;
            border: none;
            color: #747d8c;
            font-size: 10px;
            margin-top: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 返回大廳按鈕 -->
    <button onclick="window.location.href='index.html'" style="all: unset; position: fixed; top: 15px; left: 15px; z-index: 99999; box-sizing: border-box; height: 36px; padding: 0 14px; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; color: #333333; background-color: #ffffff; border: 1px solid #d1d5db; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.12); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none;">
        ⬅️ 返回大廳
    </button>

    <div id="game-wrap">
        <h2>🔮 每日神諭占卜</h2>
        <div class="tagline">傾聽星辰低語，洞悉今日運勢</div>

        <div class="crystal-zone">
            <div class="crystal-ball" id="crystal" onclick="tryDraw()">🔮</div>
        </div>

        <div id="fortune-card">
            <div class="fortune-rank" id="card-rank">大吉</div>
            <div class="fortune-desc" id="card-desc">...</div>
            <div class="fortune-lucky" id="card-lucky">幸運指引：...</div>
        </div>

        <button class="btn-divine" id="btn-draw" onclick="tryDraw()">✨ 揭示今日命運</button>
        <div class="daily-tip" id="daily-tip">每日限定占卜一次，每日凌晨重置</div>

        <button class="test-reset-btn" onclick="devReset()">🔄 清除今日紀錄 (測試用)</button>
    </div>

<script>
const fortunes = [
    { rank: "🌟 超級大吉", desc: "今日星象罕見共振，你的直覺極其靈敏，適合做出重要決定或嘗試新事物！", lucky: "幸運物：熱美式 / 幸運方位：正南方" },
    { rank: "☀️ 大吉", desc: "微風拂面，貴人運爆棚。保持笑容，身邊的人會為你帶來意想不到的好消息。", lucky: "幸運物：黃色配件 / 幸運數字：7" },
    { rank: "🌤️ 中吉", desc: "平靜而充實的一天。按部就班推進手頭的工作，會有踏實的收穫與滿足感。", lucky: "幸運物：薄荷糖 / 幸運顏色：淺藍色" },
    { rank: "🌱 小吉", desc: "偶有小插曲，但不影響大局。轉角處的小確幸正在等著你發現。", lucky: "幸運物：筆記本 / 幸運時段：下午 3 點" },
    { rank: "🍵 平安吉", desc: "適合修養身心的一天。放慢腳步，喝杯溫水，給自己留一段安靜思考的時間。", lucky: "幸運物：溫熱花草茶 / 幸運習慣：深呼吸三次" },
    { rank: "🌧️ 末吉（化險為夷）", desc: "可能遇到一些令人無奈的小麻煩，但切忌急躁，保持幽默感即可迎刃而解。", lucky: "幸運解方：少管閒事，準時下班" },
    { rank: "⚡ 驚奇狂想籤", desc: "今天你的命運充滿不確定性！可能在路邊撿到奇怪的小石子，或是遇見有趣的人。", lucky: "幸運物：滑板或香蕉皮" }
];

function getTodayString() {
    let d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function init() {
    let today = getTodayString();
    let saved = localStorage.getItem("daily_divination_record");

    if (saved) {
        try {
            let record = JSON.parse(saved);
            if (record.date === today) {
                // 今天已經占卜過，直接還原籤詩並鎖定
                showResult(record.fortune);
                lockButton();
                return;
            }
        } catch (e) {
            console.error("載入失敗", e);
        }
    }
    // 今天尚未占卜
    unlockButton();
}

function tryDraw() {
    let today = getTodayString();
    let saved = localStorage.getItem("daily_divination_record");

    if (saved) {
        try {
            let record = JSON.parse(saved);
            if (record.date === today) {
                alert("今日的神諭已經降臨！請明天再來占卜～");
                return;
            }
        } catch (e) {}
    }

    // 開始占卜動畫
    let ball = document.getElementById("crystal");
    let btn = document.getElementById("btn-draw");
    btn.disabled = true;
    btn.innerText = "🌀 命運編織中...";
    ball.classList.add("animating");

    setTimeout(() => {
        ball.classList.remove("animating");
        let picked = fortunes[Math.floor(Math.random() * fortunes.length)];

        // 儲存今日紀錄
        let record = {
            date: today,
            fortune: picked
        };
        localStorage.setItem("daily_divination_record", JSON.stringify(record));

        showResult(picked);
        lockButton();
    }, 1200);
}

function showResult(picked) {
    let card = document.getElementById("fortune-card");
    document.getElementById("card-rank").innerText = picked.rank;
    document.getElementById("card-desc").innerText = picked.desc;
    document.getElementById("card-lucky").innerText = picked.lucky;
    card.style.display = "block";
}

function lockButton() {
    let btn = document.getElementById("btn-draw");
    btn.disabled = true;
    btn.innerText = "🔒 今日已占卜，明日再來！";
    document.getElementById("daily-tip").innerText = "今日的星辰指引已揭曉，請明日凌晨重整後再來。";
    document.getElementById("daily-tip").style.color = "#ffd166";
}

function unlockButton() {
    let btn = document.getElementById("btn-draw");
    btn.disabled = false;
    btn.innerText = "✨ 揭示今日命運";
    document.getElementById("daily-tip").innerText = "每日限定占卜一次，每日凌晨重置";
    document.getElementById("daily-tip").style.color = "#a4b0be";
    document.getElementById("fortune-card").style.display = "none";
}

// 測試用重設按鈕
function devReset() {
    if (confirm("要清除今日占卜紀錄以便重新測試嗎？")) {
        localStorage.removeItem("daily_divination_record");
        unlockButton();
    }
}

init();
</script>
</body>
</html>
