<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>單機猜拳對戰</title>
    <style>
        :root {
            --primary: #1976d2;
            --success: #2e7d32;
            --bg: #f5f5f5;
        }
        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 360px;
            width: 100%;
            text-align: center;
            margin-top: 40px; 
        }
        h2 { margin-top: 0; color: #333; margin-bottom: 8px;}
        
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        button:disabled { background: #bdbdbd; cursor: not-allowed; }
        
        .score-board {
            display: flex;
            justify-content: space-between;
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: bold;
        }
        
        .hands-grid {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-top: 20px;
        }
        .hand-btn {
            font-size: 40px;
            padding: 15px 0;
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            width: 30%;
            color: #333;
        }
        .hand-btn.selected {
            border-color: var(--primary);
            background: #e3f2fd;
        }
        
        .status-box {
            min-height: 60px;
            color: #555;
            font-weight: bold;
            margin: 16px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .result-anim {
            font-size: 20px;
            animation: pop 0.4s ease-out;
            margin-top: 5px;
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 像素級統一的懸浮返回大廳按鈕 -->
    <button onclick="window.location.href='index.html'" style="all: unset; position: fixed; top: 15px; left: 15px; z-index: 99999; box-sizing: border-box; height: 36px; padding: 0 14px; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; color: #333333; background-color: #ffffff; border: 1px solid #d1d5db; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.12); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none;">
        ⬅️ 返回大廳
    </button>

    <div class="container">
        <h2 style="margin-bottom: 12px;">🤖 單機猜拳對戰</h2>
        
        <!-- 動態勝利條件設定 -->
        <div style="margin-bottom: 16px; font-weight: bold; color: #555; background: #eee; padding: 6px; border-radius: 8px; display: inline-block;">
            👑 目標：
            <select id="win-goal" onchange="changeGoal(this.value)" style="border: 1px solid #ccc; background: white; padding: 4px; font-weight: bold; border-radius: 4px;">
                <option value="2" selected>先拿 2 勝</option>
                <option value="3">先拿 3 勝</option>
                <option value="4">先拿 4 勝</option>
                <option value="5">先拿 5 勝</option>
            </select>
        </div>
        
        <div class="score-board">
            <div>
                <div style="color: var(--primary);">玩家</div>
                <div style="font-size: 24px;" id="my-score">0</div>
            </div>
            <div style="align-self: center; font-size: 20px;">VS</div>
            <div>
                <div style="color: #d32f2f;">電腦 🤖</div>
                <div style="font-size: 24px;" id="ai-score">0</div>
            </div>
        </div>

        <div class="status-box" id="game-msg">👉 請選擇你要出的拳！</div>
        
        <div class="hands-grid" id="hand-buttons">
            <button class="hand-btn" onclick="playRound('✌️')">✌️</button>
            <button class="hand-btn" onclick="playRound('✊')">✊</button>
            <button class="hand-btn" onclick="playRound('✋')">✋</button>
        </div>

        <!-- 重置區塊 (預設隱藏) -->
        <div id="restart-area" style="display: none; margin-top: 15px;">
            <button onclick="resetGame()" style="background: var(--primary); width: auto; padding: 10px 24px;">🔄 再玩一局</button>
        </div>
    </div>

<script>
let myScore = 0;
let aiScore = 0;
let winGoal = 2;
let isAnimating = false;

const msgBox = document.getElementById('game-msg');
const handBtns = document.getElementById('hand-buttons');
const restartArea = document.getElementById('restart-area');
const choices = ['✌️', '✊', '✋'];

function changeGoal(val) {
    winGoal = parseInt(val);
    resetGame(); // 更改目標時重新開始
}

function playRound(myChoice) {
    if (isAnimating) return; // 避免連點
    isAnimating = true;
    
    // 鎖定按鈕樣式
    Array.from(handBtns.children).forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === myChoice) btn.classList.add('selected');
    });

    msgBox.innerHTML = `電腦思考中... 🤖`;

    // 模擬 AI 思考延遲 (500 毫秒)
    setTimeout(() => {
        let aiChoice = choices[Math.floor(Math.random() * choices.length)];
        checkResult(myChoice, aiChoice);
    }, 500);
}

function checkResult(myChoice, aiChoice) {
    let resultMsg = "";
    
    if (myChoice === aiChoice) {
        resultMsg = `<div style="color:#555;">電腦出 <b>${aiChoice}</b></div><div class="result-anim">🤝 雙方平手！</div>`;
    } else if (
        (myChoice === '✌️' && aiChoice === '✋') ||
        (myChoice === '✊' && aiChoice === '✌️') ||
        (myChoice === '✋' && aiChoice === '✊')
    ) {
        myScore++;
        resultMsg = `<div style="color:#555;">電腦出 <b>${aiChoice}</b></div><div class="result-anim" style="color:var(--success)">🎉 你贏了這回合！</div>`;
    } else {
        aiScore++;
        resultMsg = `<div style="color:#555;">電腦出 <b>${aiChoice}</b></div><div class="result-anim" style="color:#d32f2f">😭 電腦得分！</div>`;
    }
    
    document.getElementById('my-score').innerText = myScore;
    document.getElementById('ai-score').innerText = aiScore;
    msgBox.innerHTML = resultMsg;

    // 檢查是否有人達成勝利條件
    if (myScore >= winGoal || aiScore >= winGoal) {
        setTimeout(showGameOver, 800);
    } else {
        setTimeout(resetRound, 1200);
    }
}

function resetRound() {
    isAnimating = false;
    msgBox.innerHTML = `👉 請選擇你要出的拳！`;
    Array.from(handBtns.children).forEach(btn => {
        btn.disabled = false;
        btn.classList.remove('selected');
    });
}

function showGameOver() {
    let winner = myScore >= winGoal ? "你" : "電腦";
    let color = myScore >= winGoal ? "var(--success)" : "#d32f2f";
    
    msgBox.innerHTML = `<div style="font-size:20px; color:${color}; margin-top: 10px;">🏁 遊戲結束！<br>🏆 恭喜 <b>${winner}</b> 獲得最終勝利！</div>`;
    handBtns.style.display = 'none';
    restartArea.style.display = 'block';
}

function resetGame() {
    myScore = 0;
    aiScore = 0;
    isAnimating = false;
    document.getElementById('my-score').innerText = myScore;
    document.getElementById('ai-score').innerText = aiScore;
    
    handBtns.style.display = 'flex';
    restartArea.style.display = 'none';
    resetRound();
}
</script>
</body>
</html>
