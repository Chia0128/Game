<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>迷你開心農場</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #e8f5e9;
            color: #333;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            touch-action: manipulation;
            user-select: none;
            transition: background-color 1s ease;
        }

        /* 天氣背景變化 */
        body.weather-sunny { background-color: #e8f5e9; }
        body.weather-rainy { background-color: #90caf9; }
        body.weather-drought { background-color: #ffcc80; }

        /* 返回大廳按鈕固定左上角 */
        .btn-home {
            position: fixed; top: 15px; left: 15px; z-index: 99999;
            box-sizing: border-box; height: 36px; padding: 0 14px;
            font-family: system-ui, -apple-system, sans-serif; font-size: 14px;
            font-weight: 600; color: #333333; background-color: #ffffff;
            border: 1px solid #d1d5db; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
        }

        #game-wrap {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
            border: 2px solid #81c784;
            box-sizing: border-box;
            margin-top: 30px;
        }

        h2 { margin: 0 0 12px 0; color: #2e7d32; font-size: 20px; }

        /* 天氣告示牌 */
        #weather-banner {
            background: #fff9c4; color: #f57f17; padding: 6px 12px;
            border-radius: 8px; font-size: 12px; font-weight: bold;
            margin-bottom: 12px; border: 1px dashed #fbc02d;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }

        /* 頂部狀態列 */
        .header-stats {
            display: flex; justify-content: space-between; background: #f1f8e9;
            padding: 10px 15px; border-radius: 12px; margin-bottom: 12px;
            font-size: 14px; font-weight: bold; border: 1px solid #c5e1a5;
        }
        .stat-gold { color: #f57f17; }
        .stat-lvl { color: #1565c0; }

        /* 農場網格 */
        .farm-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            background: #aed581; padding: 12px; border-radius: 12px; margin-bottom: 12px;
        }

        /* 單塊田地 */
        .plot {
            background: #8d6e63; height: 80px; border-radius: 8px;
            border: 3px solid #5d4037; position: relative; cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 36px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.2); transition: transform 0.1s;
        }
        .plot:active { transform: scale(0.95); }
        .plot.locked { background: #e0e0e0; border-color: #9e9e9e; cursor: not-allowed; }
        .plot.locked::after { content: '🔒'; font-size: 24px; }

        /* 進度條 */
        .progress-wrap {
            position: absolute; bottom: 4px; left: 10%; width: 80%; height: 6px;
            background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden; display: none;
        }
        .progress-bar { height: 100%; width: 0%; background: #64b5f6; transition: width 1s linear; }

        /* 雜草與蟲子 */
        .weed, .bug {
            position: absolute; font-size: 16px; cursor: pointer; z-index: 10;
            animation: bounce 1s infinite alternate;
        }
        .weed { top: -5px; right: -5px; } .bug { top: -5px; left: -5px; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-3px); } }

        /* 日誌區 */
        .log-box {
            background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px;
            height: 90px; overflow-y: auto; padding: 8px; font-size: 11px;
            line-height: 1.4; text-align: left; margin-bottom: 8px; color: #555;
        }
        .log-entry { border-bottom: 1px dashed #eee; padding-bottom: 3px; margin-bottom: 3px; }

        /* 分頁按鈕 */
        .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
        .tab-btn {
            flex: 1 1 18%; padding: 8px 0; font-size: 11px; font-weight: bold;
            background: #f1f8e9; color: #555; border: 1px solid #c5e1a5;
            border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active { background: #4caf50; color: white; border-color: #388e3c; }
        .tab-content { display: none; } .tab-content.active { display: block; }

        /* 列表項目 */
        .item-list { max-height: 250px; overflow-y: auto; background: #f9f9f9; border-radius: 8px; padding: 4px; }
        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; border: 1px solid #e0e0e0; padding: 6px 10px;
            border-radius: 8px; margin-bottom: 6px; text-align: left; gap: 6px;
        }
        .item-info { flex-grow: 1; }
        .item-info b { font-size: 13px; color: #333; }
        .item-info p { margin: 2px 0 0 0; font-size: 10px; color: #777; }
        
        .btn-group { display: flex; gap: 4px; flex-direction: column; }
        .action-btn {
            background: #4caf50; color: white; border: none; padding: 4px 8px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; white-space: nowrap;
        }
        .action-btn.btn-sell { background: #f57f17; }
        .action-btn:disabled { background: #bdbdbd; cursor: not-allowed; }

        /* 系統按鈕 */
        .sys-btn {
            background: #e53935; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; font-size: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; width: 100%;
        }

        /* 彈窗 Modal */
        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-card {
            background: #fff; padding: 16px; border-radius: 12px; width: 90%; max-width: 300px; /* 限制寬度變窄 */
            max-height: 80%; overflow-y: auto; text-align: center;
        }
        .modal-close {
            background: #e53935; color: white; border: none; padding: 8px;
            border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold;
        }

        /* 飄字動畫 */
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-30px) scale(1.2); } }
        .floating-text { position: absolute; animation: floatUp 1s ease-out forwards; font-weight: bold; font-size: 14px; pointer-events: none; z-index: 50; text-shadow: 1px 1px 0 #fff; }
    </style>
</head>
<body class="weather-sunny">

    <button class="btn-home" onclick="window.location.href='index.html'">⬅️ 返回大廳</button>

    <div id="game-wrap">
        <h2>🌻 迷你開心農場</h2>
        
        <div id="weather-banner">☀️ 天氣：晴朗無雲 (生長正常)</div>

        <div class="header-stats">
            <div class="stat-lvl">Lv.<span id="txt-lvl">1</span> (<span id="txt-exp">0</span>/<span id="txt-maxexp">50</span>)</div>
            <div class="stat-gold">💰 <span id="txt-gold">200</span></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('farm')">🏡 農場</button>
            <button class="tab-btn" onclick="switchTab('pasture')">🐄 畜牧</button>
            <button class="tab-btn" onclick="switchTab('factory')">🏭 工廠</button>
            <button class="tab-btn" onclick="switchTab('bag')">🎒 背包</button>
            <button class="tab-btn" onclick="switchTab('shop')">🛒 商店</button>
        </div>

        <!-- 1. 農場 -->
        <div id="tab-farm" class="tab-content active">
            <div class="farm-grid" id="farm-grid"></div>
            <button class="action-btn" style="width: 100%; background: #ff9800; font-size: 13px; padding: 8px;" onclick="stealCrop()">
                🕵️ 去好友家偷菜 (冷卻: <span id="txt-steal-cd">0</span>s)
            </button>
        </div>

        <!-- 2. 畜牧場 -->
        <div id="tab-pasture" class="tab-content">
            <div class="item-list" id="pasture-list"></div>
        </div>

        <!-- 3. 加工廠 -->
        <div id="tab-factory" class="tab-content">
            <div class="item-list" id="factory-list"></div>
        </div>

        <!-- 4. 商店 -->
        <div id="tab-shop" class="tab-content">
            <div class="item-list" id="shop-list"></div>
        </div>

        <!-- 5. 背包 -->
        <div id="tab-bag" class="tab-content">
            <h4 style="margin:4px 0; font-size:13px; color:#2e7d32; text-align:left;">🌱 種子區</h4>
            <div class="item-list" id="bag-seeds" style="max-height:100px; margin-bottom:8px;"></div>
            <h4 style="margin:4px 0; font-size:13px; color:#2e7d32; text-align:left;">🧺 產物區 (農作/加工品)</h4>
            <div class="item-list" id="bag-products" style="max-height:150px;"></div>
        </div>

        <div class="log-box" id="log-box"></div>
        
        <button class="sys-btn" onclick="resetSave()">⚠️ 清除存檔並重置</button>

        <!-- 播種選擇視窗 (已改窄) -->
        <div id="modal-overlay">
            <div class="modal-card">
                <h3 style="margin-top:0; color:#2e7d32; font-size:16px;">選擇播種</h3>
                <div id="seed-select-list" class="item-list" style="max-height:200px;"></div>
                <button class="modal-close" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>

<script>
// --- 資料庫設定 (經驗值全-1) ---
const WEATHERS = {
    sunny: { name: '晴朗無雲', emoji: '☀️', bgClass: 'weather-sunny', desc: '生長正常', pestChance: 0.01, growthSpeed: 1 },
    rainy: { name: '傾盆大雨', emoji: '🌧️', bgClass: 'weather-rainy', desc: '生長雙倍 / 易長蟲草', pestChance: 0.03, growthSpeed: 2 },
    drought: { name: '酷熱旱災', emoji: '🔥', bgClass: 'weather-drought', desc: '停止生長 / 無蟲草', pestChance: 0.00, growthSpeed: 0 }
};

// 擴充至 9 種作物
const CROPS = {
    wheat:     { id: 'wheat', name: '小麥', emoji: '🌾', seed: '🌱', cost: 10, sell: 18, time: 8, exp: 1 }, // exp 2->1
    radish:    { id: 'radish', name: '白蘿蔔', emoji: '🥕', seed: '🌱', cost: 15, sell: 25, time: 10, exp: 4 }, // 5->4
    cabbage:   { id: 'cabbage', name: '高麗菜', emoji: '🥬', seed: '🌱', cost: 30, sell: 55, time: 30, exp: 11 }, // 12->11
    tomato:    { id: 'tomato', name: '番茄', emoji: '🍅', seed: '🌿', cost: 60, sell: 120, time: 60, exp: 24 }, // 25->24
    strawberry:{ id: 'strawberry', name: '草莓', emoji: '🍓', seed: '🌿', cost: 80, sell: 165, time: 90, exp: 14 }, // 15->14
    corn:      { id: 'corn', name: '玉米', emoji: '🌽', seed: '🌿', cost: 120, sell: 250, time: 120, exp: 49 }, // 50->49
    pineapple: { id: 'pineapple', name: '鳳梨', emoji: '🍍', seed: '🌿', cost: 180, sell: 390, time: 180, exp: 39 }, // 40->39
    watermelon:{ id: 'watermelon', name: '大西瓜', emoji: '🍉', seed: '🌿', cost: 250, sell: 550, time: 240, exp: 119 }, // 120->119
    sunflower: { id: 'sunflower', name: '黃金向日葵', emoji: '🌻', seed: '🌱', cost: 500, sell: 1200, time: 360, exp: 99 } // 100->99
};

// 加工品與畜牧副產品 (僅供販售與展示使用)
const PRODUCTS = {
    bread:   { name: '香噴噴麵包', emoji: '🍞', sell: 60 },
    jam:     { name: '酸甜綜合果醬', emoji: '🥫', sell: 450 },
    popcorn: { name: '奶油爆米花', emoji: '🍿', sell: 750 },
    cheese:  { name: '濃醇起司', emoji: '🧀', sell: 900 },
    egg:     { name: '雞蛋', emoji: '🥚', sell: 80 },
    milk:    { name: '鮮牛奶', emoji: '🥛', sell: 220 },
    truffle: { name: '珍貴松露', emoji: '🍄', sell: 850 }
};

// 合併作物進入產物清單以便統一在背包販售
Object.keys(CROPS).forEach(k => { PRODUCTS[k] = { name: CROPS[k].name, emoji: CROPS[k].emoji, sell: CROPS[k].sell }; });

// 工廠配方
const FACTORIES = {
    bakery:  { id: 'bakery', name: '烘焙坊', emoji: '🍞', req: { wheat: 2 }, out: 'bread', time: 15, exp: 4 }, // 5->4
    cannery: { id: 'cannery', name: '罐頭廠', emoji: '🥫', req: { strawberry: 1, tomato: 1 }, out: 'jam', time: 45, exp: 14 },
    snack:   { id: 'snack', name: '零食工坊', emoji: '🍿', req: { corn: 2 }, out: 'popcorn', time: 60, exp: 24 },
    dairy:   { id: 'dairy', name: '乳品加工廠', emoji: '🧀', req: { milk: 2 }, out: 'cheese', time: 90, exp: 39 }
};

// 畜牧動物
const ANIMALS = {
    chicken: { id: 'chicken', name: '咕咕雞', emoji: '🐔', cost: 300, req: ['wheat', 'radish'], out: 'egg', time: 30, exp: 9 }, // 10->9
    cow:     { id: 'cow', name: '乳牛', emoji: '🐄', cost: 800, req: ['cabbage', 'corn'], out: 'milk', time: 60, exp: 19 },
    pig:     { id: 'pig', name: '粉紅豬', emoji: '🐖', cost: 1500, req: ['watermelon', 'tomato'], out: 'truffle', time: 90, exp: 49 }
};

// --- 初始狀態 ---
const defaultState = {
    player: {
        level: 1, exp: 0, gold: 300, stealCooldown: 0,
        seeds: { wheat: 5, radish: 3, cabbage: 0, tomato: 0, strawberry: 0, corn: 0, pineapple: 0, watermelon: 0, sunflower: 0 },
        inventory: {} // 存放收成與加工品
    },
    plots: Array(6).fill(null).map((_, i) => ({ state: i >= 4 ? 'locked' : 'empty', cropId: null, progress: 0, hasWeed: false, hasBug: false })),
    animals: { chicken: { owned: false, state: 'idle', progress: 0 }, cow: { owned: false, state: 'idle', progress: 0 }, pig: { owned: false, state: 'idle', progress: 0 } },
    factories: { bakery: { state: 'idle', progress: 0 }, cannery: { state: 'idle', progress: 0 }, snack: { state: 'idle', progress: 0 }, dairy: { state: 'idle', progress: 0 } },
    weather: { current: 'sunny', timer: 60 },
    lastSaveTime: Date.now()
};

let gameData;
let currentTargetPlot = null;
const logBox = document.getElementById("log-box");

// --- 系統初始化與存檔 ---
function init() {
    loadGame();
    renderAll();
    setInterval(gameTick, 1000);
}

function saveGame() {
    gameData.lastSaveTime = Date.now();
    localStorage.setItem('miniFarmSave', JSON.stringify(gameData));
}

function loadGame() {
    let saved = localStorage.getItem('miniFarmSave');
    if (saved) {
        try {
            gameData = JSON.parse(saved);
            // 補齊可能缺少的欄位防呆
            if(!gameData.player.inventory) gameData.player.inventory = {};
            if(!gameData.animals) gameData.animals = defaultState.animals;
            if(!gameData.factories) gameData.factories = defaultState.factories;
        } catch(e) { gameData = JSON.parse(JSON.stringify(defaultState)); }
    } else {
        gameData = JSON.parse(JSON.stringify(defaultState));
        log("🌞 歡迎來到開心農場！點擊農田開始播種。");
    }

    // 計算離線時間 (不給經驗值，只推動進度)
    let offlineSeconds = Math.floor((Date.now() - gameData.lastSaveTime) / 1000);
    if (offlineSeconds > 0) {
        log(`💤 歡迎回來！你離開了 ${offlineSeconds} 秒，農牧場持續運作中 (離線無經驗值)。`);
        
        // 農田離線生長 (假設離線天氣皆為晴天 1倍速，且若有蟲草則停止)
        gameData.plots.forEach(p => {
            if (p.state === 'growing' && !p.hasWeed && !p.hasBug) {
                p.progress += offlineSeconds;
                if (p.progress >= CROPS[p.cropId].time) p.state = 'mature';
            }
        });
        // 畜牧場離線生產
        Object.keys(gameData.animals).forEach(k => {
            let a = gameData.animals[k];
            if (a.state === 'producing') {
                a.progress += offlineSeconds;
                if (a.progress >= ANIMALS[k].time) a.state = 'ready';
            }
        });
        // 工廠離線加工
        Object.keys(gameData.factories).forEach(k => {
            let f = gameData.factories[k];
            if (f.state === 'processing') {
                f.progress += offlineSeconds;
                if (f.progress >= FACTORIES[k].time) f.state = 'ready';
            }
        });
        gameData.player.stealCooldown = Math.max(0, gameData.player.stealCooldown - offlineSeconds);
    }
    
    // 套用天氣 UI
    let wInfo = WEATHERS[gameData.weather.current];
    document.body.className = wInfo.bgClass;
    document.getElementById("weather-banner").innerHTML = `${wInfo.emoji} 天氣：${wInfo.name} (${wInfo.desc})`;
}

function resetSave() {
    if(confirm("確定要刪除所有存檔並重置遊戲嗎？此操作不可逆！")) {
        localStorage.removeItem('miniFarmSave');
        location.reload();
    }
}

// --- 核心邏輯 ---
function log(msg) {
    let div = document.createElement("div"); div.className = "log-entry"; div.innerHTML = msg;
    logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
}

function getMaxExp() { return gameData.player.level * 50; }

function addExp(amount) {
    gameData.player.exp += amount;
    let threshold = getMaxExp();
    while (gameData.player.exp >= threshold) {
        gameData.player.level++;
        gameData.player.exp -= threshold;
        threshold = getMaxExp();
        
        let bonus = gameData.player.level * 50;
        gameData.player.gold += bonus;
        log(`🎉 <b>升級了！達到 Lv.${gameData.player.level}！</b> 獲得獎金 ${bonus} 金幣！`);
        
        // 檢查解鎖田地
        if (gameData.player.level >= 3 && gameData.plots[4].state === 'locked') {
            gameData.plots[4].state = 'empty'; log(`🔓 <b>第 5 塊田地解鎖！</b>`);
        }
        if (gameData.player.level >= 5 && gameData.plots[5].state === 'locked') {
            gameData.plots[5].state = 'empty'; log(`🔓 <b>第 6 塊田地解鎖！</b>`);
        }
    }
    updateUI(); saveGame();
}

function showFloatText(x, y, text, color) {
    let el = document.createElement("div"); el.className = "floating-text";
    el.innerText = text; el.style.color = color;
    el.style.left = x + "px"; el.style.top = y + "px";
    document.getElementById("game-wrap").appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

// 核心計時器
function gameTick() {
    let needsRenderFarm = false;
    let needsRenderPasture = false;
    let needsRenderFactory = false;

    // 天氣
    gameData.weather.timer--;
    if (gameData.weather.timer <= 0) {
        let roll = Math.random();
        gameData.weather.current = roll < 0.60 ? 'sunny' : (roll < 0.85 ? 'rainy' : 'drought');
        gameData.weather.timer = 60;
        let wInfo = WEATHERS[gameData.weather.current];
        document.body.className = wInfo.bgClass;
        document.getElementById("weather-banner").innerHTML = `${wInfo.emoji} 天氣：${wInfo.name} (${wInfo.desc})`;
        log(`${wInfo.emoji} 天氣轉變為：${wInfo.name}`);
    }

    let wInfo = WEATHERS[gameData.weather.current];

    // 農田
    gameData.plots.forEach((plot, idx) => {
        if (plot.state === 'growing') {
            if (plot.hasWeed || plot.hasBug) return; // 暫停生長

            plot.progress += wInfo.growthSpeed;
            let crop = CROPS[plot.cropId];
            
            let pBar = document.getElementById(`pbar-${idx}`);
            if (pBar) pBar.style.width = Math.min(100, (plot.progress / crop.time) * 100) + "%";

            if (plot.progress >= crop.time) {
                plot.state = 'mature'; needsRenderFarm = true;
                log(`✨ 【${crop.name}】成熟了！`);
            } else {
                if (Math.random() < wInfo.pestChance && !plot.hasWeed && !plot.hasBug) {
                    if (Math.random() < 0.5) plot.hasWeed = true; else plot.hasBug = true;
                    needsRenderFarm = true;
                }
            }
        }
    });

    // 畜牧場
    Object.keys(gameData.animals).forEach(k => {
        let a = gameData.animals[k];
        if (a.state === 'producing') {
            a.progress++;
            if (a.progress >= ANIMALS[k].time) { a.state = 'ready'; needsRenderPasture = true; }
        }
    });

    // 工廠
    Object.keys(gameData.factories).forEach(k => {
        let f = gameData.factories[k];
        if (f.state === 'processing') {
            f.progress++;
            if (f.progress >= FACTORIES[k].time) { f.state = 'ready'; needsRenderFactory = true; }
        }
    });

    if (gameData.player.stealCooldown > 0) {
        gameData.player.stealCooldown--;
        document.getElementById("txt-steal-cd").innerText = gameData.player.stealCooldown;
    }

    if (needsRenderFarm) renderFarm();
    if (needsRenderPasture) renderPasture();
    if (needsRenderFactory) renderFactory();
    
    // 存檔 (每秒)
    saveGame();
}

// --- 渲染與操作函式 ---
function renderAll() {
    renderFarm(); renderPasture(); renderFactory(); renderShop(); renderBag(); updateUI();
}

function renderFarm() {
    const grid = document.getElementById("farm-grid"); grid.innerHTML = "";
    gameData.plots.forEach((plot, idx) => {
        let div = document.createElement("div"); div.className = `plot ${plot.state === 'locked' ? 'locked' : ''}`;
        div.onclick = (e) => handlePlotClick(idx, e);

        if (plot.state === 'growing') {
            div.innerText = CROPS[plot.cropId].seed;
            let pWrap = document.createElement("div"); pWrap.className = "progress-wrap"; pWrap.style.display = "block";
            let pBar = document.createElement("div"); pBar.className = "progress-bar"; pBar.id = `pbar-${idx}`;
            pBar.style.width = Math.min(100, (plot.progress / CROPS[plot.cropId].time) * 100) + "%";
            pWrap.appendChild(pBar); div.appendChild(pWrap);
        } else if (plot.state === 'mature') {
            div.innerText = CROPS[plot.cropId].emoji;
        }
        if (plot.hasWeed) { let w = document.createElement("div"); w.className="weed"; w.innerText="🌿"; w.onclick=(e)=>{e.stopPropagation(); clearPest(idx,'weed',e)}; div.appendChild(w); }
        if (plot.hasBug) { let b = document.createElement("div"); b.className="bug"; b.innerText="🐛"; b.onclick=(e)=>{e.stopPropagation(); clearPest(idx,'bug',e)}; div.appendChild(b); }
        grid.appendChild(div);
    });
}

function handlePlotClick(idx, event) {
    let plot = gameData.plots[idx];
    if (plot.state === 'locked') return log("🔒 田地未解鎖 (Lv.3、Lv.5)。");
    if (plot.hasWeed || plot.hasBug) return log("⚠️ 請先點擊清除雜草或蟲子！");

    if (plot.state === 'empty') {
        currentTargetPlot = idx; openSeedModal();
    } else if (plot.state === 'growing') {
        let crop = CROPS[plot.cropId];
        let remain = Math.max(0, crop.time - Math.floor(plot.progress));
        let ws = WEATHERS[gameData.weather.current].growthSpeed;
        let sTxt = ws === 0 ? "(旱災停滯)" : (ws === 2 ? "(雨天加速)" : "");
        log(`⏳ 【${crop.name}】還需 ${remain} 秒 ${sTxt}`);
    } else if (plot.state === 'mature') {
        harvest(idx, event);
    }
}

function clearPest(idx, type, event) {
    let plot = gameData.plots[idx];
    plot[type === 'weed' ? 'hasWeed' : 'hasBug'] = false;
    log(`${type === 'weed' ? '🌿 除草' : '🐛 抓蟲'}成功！獲得 1 經驗。`); // 經驗值降為 1
    addExp(1);
    
    const rect = event.target.getBoundingClientRect(); const wrapRect = document.getElementById("game-wrap").getBoundingClientRect();
    showFloatText(rect.left - wrapRect.left, rect.top - wrapRect.top, "+1 EXP", "#1565c0");
    renderFarm(); saveGame();
}

function harvest(idx, event) {
    let plot = gameData.plots[idx];
    let crop = CROPS[plot.cropId];
    
    // 收成不換錢，放進背包
    gameData.player.inventory[plot.cropId] = (gameData.player.inventory[plot.cropId] || 0) + 1;
    addExp(crop.exp);
    
    log(`🧺 收成了【${crop.name}】！存入背包，獲得 ${crop.exp} 經驗。`);
    const rect = event.target.getBoundingClientRect(); const wrapRect = document.getElementById("game-wrap").getBoundingClientRect();
    showFloatText(rect.left - wrapRect.left + 20, rect.top - wrapRect.top, `+1 🧺`, "#8d6e63");

    gameData.plots[idx] = { state: 'empty', cropId: null, progress: 0, hasWeed: false, hasBug: false };
    renderFarm(); renderBag(); renderFactory(); renderPasture(); updateUI(); saveGame();
}

function openSeedModal() {
    let list = document.getElementById("seed-select-list"); list.innerHTML = "";
    let hasSeeds = false;
    Object.keys(CROPS).forEach(id => {
        if (gameData.player.seeds[id] > 0) {
            hasSeeds = true; let c = CROPS[id];
            let div = document.createElement("div"); div.className = "item-row";
            div.innerHTML = `<div class="item-info"><b>${c.emoji} ${c.name} (擁有: ${gameData.player.seeds[id]})</b><p>成熟: ${c.time}秒</p></div><button class="action-btn" onclick="plantSeed('${id}')">播種</button>`;
            list.appendChild(div);
        }
    });
    if (!hasSeeds) list.innerHTML = `<p style="color:#777; font-size:12px; margin:20px 0;">背包沒有種子，請去商店購買！</p>`;
    document.getElementById("modal-overlay").style.display = "flex";
}
function closeModal() { document.getElementById("modal-overlay").style.display = "none"; currentTargetPlot = null; }

function plantSeed(id) {
    if (gameData.player.seeds[id] <= 0 || currentTargetPlot === null) return;
    gameData.player.seeds[id]--;
    gameData.plots[currentTargetPlot] = { state: 'growing', cropId: id, progress: 0, hasWeed: false, hasBug: false };
    log(`🌱 播種了【${CROPS[id].name}】！`);
    closeModal(); renderFarm(); renderBag(); saveGame();
}

function stealCrop() {
    if (gameData.player.stealCooldown > 0) return log(`⏳ 巡邏犬還醒著，再等 ${gameData.player.stealCooldown} 秒！`);
    let keys = Object.keys(CROPS); let rId = keys[Math.floor(Math.random() * keys.length)]; let crop = CROPS[rId];
    
    let stealGold = Math.floor(crop.sell * 0.5);
    let stealExp = Math.max(0, Math.floor(crop.exp * 0.5) - 1); // 經驗值降1，確保不為負
    gameData.player.gold += stealGold; addExp(stealExp);
    gameData.player.stealCooldown = 60;
    
    log(`🕵️ 從老王農場偷摘了【${crop.name}】賣掉獲得 ${stealGold} 金幣與 ${stealExp} 經驗！`);
    updateUI(); saveGame();
}

// --- 背包販售系統 ---
function renderBag() {
    // 1. 種子區
    let sList = document.getElementById("bag-seeds"); sList.innerHTML = "";
    Object.keys(gameData.player.seeds).forEach(id => {
        if (gameData.player.seeds[id] > 0) {
            let c = CROPS[id]; let div = document.createElement("div"); div.className = "item-row";
            div.innerHTML = `<div class="item-info"><b>${c.emoji} ${c.name}種子</b><p>數量: ${gameData.player.seeds[id]}</p></div>`;
            sList.appendChild(div);
        }
    });
    // 2. 產物區
    let pList = document.getElementById("bag-products"); pList.innerHTML = "";
    Object.keys(gameData.player.inventory).forEach(id => {
        let count = gameData.player.inventory[id];
        if (count > 0 && PRODUCTS[id]) {
            let p = PRODUCTS[id]; let div = document.createElement("div"); div.className = "item-row";
            div.innerHTML = `
                <div class="item-info"><b>${p.emoji} ${p.name}</b><p>數量: ${count} | 單價: ${p.sell}金</p></div>
                <div class="btn-group">
                    <button class="action-btn btn-sell" onclick="sellItem('${id}', 1)">賣 1 個</button>
                    <button class="action-btn btn-sell" onclick="sellItem('${id}', 'all')">全賣</button>
                </div>
            `;
            pList.appendChild(div);
        }
    });
}

function sellItem(id, amount) {
    let current = gameData.player.inventory[id] || 0;
    if (current <= 0) return;
    let qty = amount === 'all' ? current : 1;
    let profit = PRODUCTS[id].sell * qty;
    
    gameData.player.inventory[id] -= qty;
    gameData.player.gold += profit;
    log(`💰 賣出 ${qty} 個【${PRODUCTS[id].name}】，獲得 ${profit} 金幣！`);
    
    renderBag(); renderFactory(); renderPasture(); updateUI(); saveGame();
}

// --- 商店系統 ---
function renderShop() {
    let list = document.getElementById("shop-list"); list.innerHTML = "";
    Object.keys(CROPS).forEach(id => {
        let c = CROPS[id]; let div = document.createElement("div"); div.className = "item-row";
        div.innerHTML = `<div class="item-info"><b>${c.emoji} ${c.name}種子</b><p>成本: ${c.cost}金 | 成熟: ${c.time}s</p></div><button class="action-btn" onclick="buySeed('${id}')">購買</button>`;
        list.appendChild(div);
    });
}
function buySeed(id) {
    if (gameData.player.gold >= CROPS[id].cost) {
        gameData.player.gold -= CROPS[id].cost; gameData.player.seeds[id]++;
        log(`🛒 購買了 1 顆【${CROPS[id].name}】種子。`); updateUI(); renderBag(); saveGame();
    } else log(`❌ 金幣不足。`);
}

// --- 畜牧系統 ---
function renderPasture() {
    let list = document.getElementById("pasture-list"); list.innerHTML = "";
    Object.keys(ANIMALS).forEach(id => {
        let a = ANIMALS[id]; let state = gameData.animals[id];
        let div = document.createElement("div"); div.className = "item-row";
        if (!state.owned) {
            div.innerHTML = `<div class="item-info"><b>${a.emoji} ${a.name}</b><p>飼料: ${a.req.map(r=>PRODUCTS[r].name).join(' 或 ')}<br>產出: ${PRODUCTS[a.out].name}</p></div><button class="action-btn" onclick="buyAnimal('${id}')">購買(${a.cost}金)</button>`;
        } else {
            let html = `<div class="item-info"><b>${a.emoji} ${a.name}</b>`;
            if (state.state === 'idle') {
                let reqHtml = a.req.map(r => {
                    let has = gameData.player.inventory[r] || 0;
                    return `<button class="action-btn" style="margin-top:2px; ${has===0?'background:#888':''}" onclick="feedAnimal('${id}', '${r}')" ${has===0?'disabled':''}>餵食 ${PRODUCTS[r].name}(${has})</button>`;
                }).join(' ');
                html += `<p style="margin-top:4px;">${reqHtml}</p></div>`;
            } else if (state.state === 'producing') {
                let remain = Math.max(0, a.time - state.progress);
                html += `<p>生產中... 還需 ${remain} 秒</p></div>`;
            } else if (state.state === 'ready') {
                html += `<p>✨ 產出完畢！</p></div><button class="action-btn" style="background:#fbc02d; color:#000;" onclick="collectAnimal('${id}')">收穫副產物</button>`;
            }
            div.innerHTML = html;
        }
        list.appendChild(div);
    });
}
function buyAnimal(id) {
    if (gameData.player.gold >= ANIMALS[id].cost) {
        gameData.player.gold -= ANIMALS[id].cost; gameData.animals[id].owned = true;
        log(`🐄 購買了【${ANIMALS[id].name}】！`); renderPasture(); updateUI(); saveGame();
    } else log(`❌ 金幣不足。`);
}
function feedAnimal(aId, reqId) {
    if ((gameData.player.inventory[reqId] || 0) <= 0) return;
    gameData.player.inventory[reqId]--;
    gameData.animals[aId].state = 'producing'; gameData.animals[aId].progress = 0;
    log(`🍽️ 餵食了【${ANIMALS[aId].name}】！開始生產。`);
    renderPasture(); renderBag(); renderFactory(); saveGame();
}
function collectAnimal(aId) {
    let outId = ANIMALS[aId].out;
    gameData.player.inventory[outId] = (gameData.player.inventory[outId] || 0) + 1;
    gameData.animals[aId].state = 'idle';
    addExp(ANIMALS[aId].exp);
    log(`🧺 從【${ANIMALS[aId].name}】收穫了【${PRODUCTS[outId].name}】！`);
    renderPasture(); renderBag(); renderFactory(); saveGame();
}

// --- 工廠系統 ---
function renderFactory() {
    let list = document.getElementById("factory-list"); list.innerHTML = "";
    Object.keys(FACTORIES).forEach(id => {
        let f = FACTORIES[id]; let state = gameData.factories[id];
        let reqStr = Object.keys(f.req).map(r => `${PRODUCTS[r].name}x${f.req[r]}`).join(', ');
        let canCraft = Object.keys(f.req).every(r => (gameData.player.inventory[r] || 0) >= f.req[r]);
        
        let div = document.createElement("div"); div.className = "item-row";
        let html = `<div class="item-info"><b>${f.emoji} ${f.name}</b>`;
        
        if (state.state === 'idle') {
            html += `<p>配方: ${reqStr} ➔ ${PRODUCTS[f.out].name}</p></div><button class="action-btn" style="${canCraft?'':'background:#888'}" onclick="startFactory('${id}')" ${canCraft?'':'disabled'}>加工</button>`;
        } else if (state.state === 'processing') {
            let remain = Math.max(0, f.time - state.progress);
            html += `<p>⚙️ 加工中... 還需 ${remain} 秒</p></div>`;
        } else if (state.state === 'ready') {
            html += `<p>✨ 加工完成！</p></div><button class="action-btn" style="background:#fbc02d; color:#000;" onclick="collectFactory('${id}')">領取成品</button>`;
        }
        div.innerHTML = html; list.appendChild(div);
    });
}
function startFactory(id) {
    let f = FACTORIES[id];
    let canCraft = Object.keys(f.req).every(r => (gameData.player.inventory[r] || 0) >= f.req[r]);
    if (!canCraft) return;
    Object.keys(f.req).forEach(r => { gameData.player.inventory[r] -= f.req[r]; });
    gameData.factories[id].state = 'processing'; gameData.factories[id].progress = 0;
    log(`🏭 【${f.name}】開始加工生產...`);
    renderFactory(); renderBag(); renderPasture(); saveGame();
}
function collectFactory(id) {
    let outId = FACTORIES[id].out;
    gameData.player.inventory[outId] = (gameData.player.inventory[outId] || 0) + 1;
    gameData.factories[id].state = 'idle';
    addExp(FACTORIES[id].exp);
    log(`📦 【${FACTORIES[id].name}】生產完畢！獲得【${PRODUCTS[outId].name}】。`);
    renderFactory(); renderBag(); saveGame();
}

function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tabId).classList.add('active');
    
    if (tabId === 'farm') renderFarm();
    if (tabId === 'pasture') renderPasture();
    if (tabId === 'factory') renderFactory();
    if (tabId === 'bag') renderBag();
    if (tabId === 'shop') renderShop();
}

function updateUI() {
    document.getElementById("txt-lvl").innerText = gameData.player.level;
    document.getElementById("txt-exp").innerText = gameData.player.exp;
    document.getElementById("txt-maxexp").innerText = getMaxExp();
    document.getElementById("txt-gold").innerText = gameData.player.gold;
}

// 啟動遊戲
init();
</script>
</body>
</html>
